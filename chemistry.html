<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Chemistry — Studywith Labobo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   STUDYWITH LABOBO — Design System v2
   Tokens → Typography → Layout → Components → Animations
═══════════════════════════════════════════════════════════════════ */

/* ── Design Tokens ────────────────────────────────────────────────── */
:root {
  /* Brand (same both modes) */
  --brand:        #2B7FFF;
  --brand-dark:   #1D6AE5;
  --brand-soft:   rgba(43,127,255,0.12);
  --accent:       #06B6D4;
  --accent-soft:  rgba(6,182,212,0.10);
  /* Semantic (same both modes) */
  --correct:      #16A34A;
  --correct-soft: rgba(22,163,74,0.12);
  --review:       #D97706;
  --review-soft:  rgba(217,119,6,0.12);
  --wrong:        #DC2626;
  --wrong-soft:   rgba(220,38,38,0.12);
  /* Radii */
  --radius:    14px;
  --radius-sm:  9px;
  --radius-xs:  6px;
}

/* ── Dark Mode (default) ──────────────────────────────────────────── */
:root, [data-theme="dark"] {
  --bg:             #0B1220;
  --surface:        #111A2E;
  --surface-raised: #162035;
  --surface-float:  #1C2940;
  --border:         #1E2D47;
  --border-strong:  #243858;
  --text:           #E8EEFF;
  --text-soft:      #8BA3CC;
  --text-muted:     #4D6488;
  --input-bg:       #0D1624;
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.55);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.60);
  --shadow-lg:  0 12px 40px rgba(0,0,0,0.70);
  --glow-brand:   0 0 28px rgba(43,127,255,0.22);
  --glow-correct: 0 0 20px rgba(22,163,74,0.28);
  --glow-wrong:   0 0 20px rgba(220,38,38,0.28);
}

/* ── Light Mode ───────────────────────────────────────────────────── */
[data-theme="light"] {
  --bg:             #EEF3FF;
  --surface:        #FFFFFF;
  --surface-raised: #F3F7FF;
  --surface-float:  #EBF1FF;
  --border:         #D4E0F5;
  --border-strong:  #B8CCE8;
  --text:           #0F172A;
  --text-soft:      #455A7A;
  --text-muted:     #8FA3BF;
  --input-bg:       #F8FAFF;
  --shadow-sm:  0 1px 3px rgba(15,23,42,0.07), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:  0 4px 14px rgba(15,23,42,0.09), 0 2px 4px rgba(15,23,42,0.04);
  --shadow-lg:  0 12px 36px rgba(15,23,42,0.13), 0 4px 8px rgba(15,23,42,0.05);
  --glow-brand: none;
  --glow-correct: none;
  --glow-wrong: none;
}

/* ── Reset ────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { transition: background-color 0.22s, color 0.22s; }

/* ── Base ─────────────────────────────────────────────────────────── */
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 70% 50% at 12% 0%,  rgba(43,127,255,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 88% 100%, rgba(6,182,212,0.05) 0%, transparent 55%);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.57;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  transition: background-color 0.22s, color 0.22s;
}
h1 { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 8px; line-height: 1.2; }
h2 { font-family: 'Poppins', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 8px; }
h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; margin: 0 0 6px; }
p  { margin: 0 0 12px; color: var(--text-soft); }
button {
  font-family: 'Inter', sans-serif; font-size: 14px;
  cursor: pointer; border: none; outline: none;
  transition: background-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.12s, border-color 0.15s;
}
input[type=text] {
  font-family: 'Inter', sans-serif; font-size: 15px;
  background: var(--input-bg); color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 15px; width: 100%; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input[type=text]::placeholder { color: var(--text-muted); }
input[type=text]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

/* ── Topbar ───────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,18,32,0.90);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid rgba(43,127,255,0.14);
  padding: 10px 22px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 1px 0 rgba(43,127,255,0.08), 0 2px 20px rgba(0,0,0,0.45);
}
[data-theme="light"] .topbar {
  background: rgba(255,255,255,0.90);
  border-bottom-color: var(--border);
  box-shadow: 0 1px 0 var(--border), var(--shadow-sm);
}
.topbar .brand {
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px;
  display: flex; align-items: center; gap: 9px;
  cursor: pointer; text-decoration: none; color: inherit;
}
.brand-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 10px rgba(43,127,255,0.45); }
.brand-text  { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text .b1 { font-size: 12.5px; font-weight: 700; color: var(--text); }
.brand-text .b2 { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.topbar .spacer { flex: 1; }
.subject-switcher {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: var(--brand-soft); color: var(--brand);
  border: 1px solid rgba(43,127,255,0.25); border-radius: 20px;
  padding: 5px 14px 5px 10px; font-size: 13px; font-weight: 600;
  text-decoration: none; white-space: nowrap;
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
}
.subject-switcher:hover {
  background: rgba(43,127,255,0.22);
  transform: translateX(-50%) translateY(-1px);
  box-shadow: 0 4px 16px rgba(43,127,255,0.2);
}
.subject-switcher svg { flex-shrink: 0; }
@media (max-width: 500px) { .subject-switcher span { display: none; } .subject-switcher { padding: 5px 10px; } }
.topbar .username { font-size: 13px; color: var(--text-muted); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); font-size: 16px; flex-shrink: 0;
  transition: background-color 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--surface-raised); color: var(--text); }
/* SVG theme toggle */
.icon-btn svg { width: 17px; height: 17px; fill: currentColor; }
.icon-btn .ico-sun, .icon-btn .ico-moon { position: absolute; transition: opacity 0.22s, transform 0.28s; }
[data-theme="dark"]  .icon-btn .ico-sun  { opacity: 1; transform: rotate(0deg); }
[data-theme="dark"]  .icon-btn .ico-moon { opacity: 0; transform: rotate(-90deg); }
[data-theme="light"] .icon-btn .ico-sun  { opacity: 0; transform: rotate(90deg); }
[data-theme="light"] .icon-btn .ico-moon { opacity: 1; transform: rotate(0deg); }
#themeBtn { position: relative; }

/* ── Layout containers ────────────────────────────────────────────── */
.container   { max-width: 1080px; margin: 0 auto; padding: 24px; }
.center-wrap { max-width: 500px;  margin: 48px auto; padding: 0 20px; }

/* ── Buttons ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-weight: 600; font-family: 'Inter', sans-serif;
  background: var(--surface-raised); color: var(--text);
  border: 1px solid var(--border);
}
.btn:hover  { background: var(--surface-float); border-color: var(--border-strong); }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 14px rgba(43,127,255,0.38);
}
.btn.primary:hover  { box-shadow: 0 6px 22px rgba(43,127,255,0.55), var(--glow-brand); transform: translateY(-1px); }
.btn.primary:active { transform: scale(0.97) translateY(0); }
.btn.ghost  { background: transparent; color: var(--text-soft); border-color: transparent; }
.btn.ghost:hover  { background: var(--surface-raised); color: var(--text); }
.btn.danger { background: var(--wrong); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(220,38,38,0.32); }
.btn.danger:hover { background: #b91c1c; box-shadow: 0 6px 18px rgba(220,38,38,0.48); }
.btn.lg     { padding: 13px 24px; font-size: 15px; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ── Card ─────────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm);
}

/* ── Welcome screen ───────────────────────────────────────────────── */
.welcome-card { max-width: 460px; margin: 0 auto; overflow: hidden; }
.welcome-hero {
  background: linear-gradient(155deg, #0C1E48 0%, #0E2860 55%, #0B1A40 100%);
  padding: 36px 28px 28px;
  text-align: center; position: relative; overflow: hidden;
  border-bottom: 1px solid rgba(43,127,255,0.18);
}
.welcome-hero::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 90% 65% at 50% -10%, rgba(43,127,255,0.40) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 110%,  rgba(6,182,212,0.14) 0%, transparent 60%);
}
.welcome-hero > * { position: relative; z-index: 1; }
.welcome-hero h1  { color: #fff; font-size: 22px; margin-bottom: 6px; }
.welcome-hero p   { color: rgba(255,255,255,0.68); font-size: 13px; margin: 0; }
.mascot-hero {
  width: 92px; height: 92px; object-fit: contain; margin-bottom: 14px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
  animation: mascotFloat 4s ease-in-out infinite;
}
[data-theme="light"] .welcome-hero { background: linear-gradient(155deg, #1D4ED8, #0EA5E9); }
[data-theme="light"] .welcome-hero::before { display: none; }
.welcome-body    { padding: 24px; }
.welcome-warn {
  background: rgba(217,119,6,0.1); border: 1px solid rgba(217,119,6,0.3);
  border-radius: var(--radius-sm); padding: 11px 14px; margin-top: 12px;
  font-size: 13px; color: var(--text);
}
@keyframes mascotFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

/* ── Home (mode select) ───────────────────────────────────────────── */
.home-header { margin-bottom: 6px; }
.home-header h1 { font-size: 24px; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 18px; }
.mode-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px;
  cursor: pointer; text-align: left;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  min-height: 160px;
}
.mode-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  opacity: 0; border-radius: var(--radius) var(--radius) 0 0;
  transition: opacity 0.18s;
}
.mode-card:hover { transform: translateY(-4px); }
.mode-card:hover::before { opacity: 1; }
/* Per-mode colors */
.mode-card.study:hover   { box-shadow: var(--shadow-md), 0 0 0 1px rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.4); }
.mode-card.study::before  { background: linear-gradient(90deg, #8B5CF6, #6366F1); }
.mode-card.study    .mode-icon { background: linear-gradient(135deg, #8B5CF6, #6366F1); }
.mode-card.practice:hover { box-shadow: var(--shadow-md), 0 0 0 1px rgba(13,148,136,0.15); border-color: rgba(13,148,136,0.4); }
.mode-card.practice::before { background: linear-gradient(90deg, #0D9488, #22C55E); }
.mode-card.practice .mode-icon { background: linear-gradient(135deg, #0D9488, #22C55E); }
.mode-card.exam:hover    { box-shadow: var(--shadow-md), 0 0 0 1px rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); }
.mode-card.exam::before   { background: linear-gradient(90deg, #DC2626, #F59E0B); }
.mode-card.exam     .mode-icon { background: linear-gradient(135deg, #DC2626, #F59E0B); }
.mode-card.review:hover  { box-shadow: var(--shadow-md), 0 0 0 1px rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); }
.mode-card.review::before  { background: linear-gradient(90deg, #6366F1, #3B82F6); }
.mode-card.review   .mode-icon { background: linear-gradient(135deg, #6366F1, #3B82F6); }
.mode-card.dashboard:hover { box-shadow: var(--shadow-md), 0 0 0 1px rgba(6,182,212,0.15); border-color: rgba(6,182,212,0.4); }
.mode-card.dashboard::before { background: linear-gradient(90deg, #06B6D4, #0EA5E9); }
.mode-card.dashboard .mode-icon { background: linear-gradient(135deg, #06B6D4, #0EA5E9); }
.mode-icon {
  width: 48px; height: 48px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 23px; margin-bottom: 14px; flex-shrink: 0;
  box-shadow: 0 3px 12px rgba(0,0,0,0.30);
  color: #fff;
}
.mode-card h3  { color: var(--text); margin-bottom: 5px; font-size: 15px; }
.mode-card p   { font-size: 12.5px; margin: 0; color: var(--text-soft); line-height: 1.5; flex: 1; }
.mode-card .badge {
  position: absolute; top: 13px; right: 13px;
  background: var(--wrong); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 10px;
  font-family: 'Poppins', sans-serif;
  box-shadow: 0 2px 8px rgba(220,38,38,0.4);
}
.mode-card.disabled { opacity: 0.35; cursor: not-allowed; }
.mode-card.disabled:hover { transform: none; box-shadow: var(--shadow-sm); border-color: var(--border); }

/* ── Page header ──────────────────────────────────────────────────── */
.page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.back-btn {
  background: var(--surface); border: 1px solid var(--border);
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); font-size: 18px;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}
.back-btn:hover { background: var(--surface-raised); color: var(--text); border-color: var(--border-strong); }
.page-header h1  { margin: 0; flex: 1; font-size: 22px; }
.ph-actions { display: flex; gap: 8px; }

/* ── Filter (study mode) ──────────────────────────────────────────── */
.filter-section { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.filter-section .card { flex: 0 0 290px; max-height: 70vh; overflow-y: auto; }
.filter-section .main { flex: 1; min-width: 0; }
.filter-search { margin-bottom: 12px; }
.subject-group { margin-bottom: 8px; }
.subject-title {
  font-family: 'Poppins', sans-serif; font-weight: 700; cursor: pointer;
  display: flex; align-items: center;
  padding: 7px 9px; background: var(--surface-raised);
  border-radius: 7px; margin-bottom: 3px;
  user-select: none; font-size: 12.5px;
  transition: background-color 0.12s;
}
.subject-title:hover { background: var(--border); }
.subject-title .count {
  margin-left: auto; font-size: 11px; color: var(--text-soft);
  background: var(--surface); padding: 2px 7px; border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif;
}
.arrow { transition: transform 0.15s; margin-right: 7px; color: var(--text-muted); }
.subject-group.open .arrow { transform: rotate(90deg); }
.topics { display: none; padding-left: 10px; margin-top: 3px; }
.subject-group.open .topics { display: block; }
.topic-row {
  display: flex; align-items: center;
  padding: 5px 7px; font-size: 12.5px; cursor: pointer;
  border-radius: 6px; color: var(--text-soft);
  transition: background-color 0.1s, color 0.1s;
}
.topic-row:hover { background: var(--surface-raised); color: var(--text); }
.topic-row input { margin-right: 7px; cursor: pointer; accent-color: var(--brand); }
.topic-row .tc { margin-left: auto; font-size: 10.5px; color: var(--text-muted); font-family: 'Space Grotesk', sans-serif; }
.filter-actions { display: flex; gap: 6px; margin-bottom: 12px; }
.filter-actions .btn { flex: 1; padding: 7px 8px; font-size: 12px; }

/* ── Progress bar ─────────────────────────────────────────────────── */
.quiz-progress-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.qpb-stat { display: flex; flex-direction: column; min-width: 62px; }
.qpb-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
.qpb-value { font-size: 17px; font-weight: 700; color: var(--text); font-family: 'Space Grotesk', sans-serif; }
.qpb-value.good { color: var(--correct); }
.qpb-value.bad  { color: var(--wrong); }
.qpb-fill { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 100px; }
.qpb-fill > div {
  height: 100%;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(43,127,255,0.45);
}

/* ── Question card ────────────────────────────────────────────────── */
.question-card {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 3px solid var(--brand);
  border-radius: var(--radius); padding: 24px 26px;
  margin-bottom: 12px; box-shadow: var(--shadow-sm);
  animation: slideUp 0.22s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11.5px; color: var(--text-muted); margin-bottom: 11px;
}
.q-tag {
  background: var(--brand-soft); color: var(--accent);
  padding: 3px 9px; border-radius: 9px;
  font-size: 11px; font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  border: 1px solid rgba(6,182,212,0.18);
}
.q-text {
  font-size: 17px; font-family: 'Lora', Georgia, serif;
  margin-bottom: 18px; line-height: 1.72; color: var(--text);
}
.options { display: flex; flex-direction: column; gap: 9px; }
.option {
  background: var(--surface-raised); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 15px;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: border-color 0.12s, background-color 0.12s, transform 0.12s;
  line-height: 1.52; color: var(--text);
  min-height: 50px;
}
.option:hover:not(.disabled) {
  border-color: var(--brand); background: var(--brand-soft);
  transform: translateX(3px);
}
.option .letter {
  background: var(--surface-float); border: 1.5px solid var(--border);
  width: 27px; height: 27px; min-width: 27px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text-soft); flex-shrink: 0;
  font-family: 'Space Grotesk', sans-serif;
  transition: background-color 0.12s, border-color 0.12s, color 0.12s;
}
.option.selected { border-color: var(--brand); background: var(--brand-soft); }
.option.selected .letter { background: var(--brand); color: #fff; border-color: var(--brand); }
.option.correct {
  background: var(--correct-soft); border-color: var(--correct); border-left-width: 4px;
  box-shadow: var(--glow-correct);
  animation: optCorrect 0.35s ease forwards;
}
.option.correct .letter { background: var(--correct); color: #fff; border-color: var(--correct); }
.option.incorrect {
  background: var(--wrong-soft); border-color: var(--wrong); border-left-width: 4px;
  box-shadow: var(--glow-wrong);
  animation: optWrong 0.42s ease forwards;
}
.option.incorrect .letter { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.option.disabled  { cursor: default; }
.option.disabled:hover { transform: none; }
@keyframes optCorrect { 0%{transform:scale(1)} 35%{transform:scale(1.013)} 100%{transform:scale(1)} }
/* Report button */
.report-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 12px; padding: 2px 8px;
  border-radius: 6px; transition: color 0.15s, background 0.15s;
  display: flex; align-items: center; gap: 4px; opacity: 0.55;
  font-family: inherit; line-height: 1;
}
.report-btn:hover { color: var(--wrong); background: var(--wrong-soft); opacity: 1; }
.report-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.report-modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; width: min(440px, 90vw);
  box-shadow: var(--shadow-lg); animation: slideUp 0.22s ease;
}
.report-modal h3 { margin: 0 0 4px; font-size: 16px; }
.report-modal > p { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }
.report-reasons { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.report-reason {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); cursor: pointer;
  font-size: 13.5px; transition: border-color 0.12s, background 0.12s;
  background: var(--surface-raised);
}
.report-reason:hover { border-color: var(--brand); background: var(--brand-soft); }
.report-reason.active { border-color: var(--brand); background: var(--brand-soft); }
.report-note {
  width: 100%; box-sizing: border-box;
  background: var(--surface-raised); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px;
  color: var(--text); font-size: 13.5px; font-family: inherit;
  resize: vertical; margin-bottom: 14px; min-height: 68px;
  transition: border-color 0.12s;
}
.report-note:focus { outline: none; border-color: var(--brand); }
.report-actions { display: flex; gap: 8px; justify-content: flex-end; }
.labobo-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--correct); border-radius: var(--radius-sm);
  padding: 12px 20px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-md); z-index: 3000; white-space: nowrap;
  animation: toastIn 0.25s ease;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes optWrong   { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
.explanation {
  margin-top: 16px; padding: 13px 15px;
  background: var(--brand-soft); border-left: 3px solid var(--brand);
  border-radius: 4px; font-size: 13.5px; line-height: 1.62; color: var(--text);
  animation: fadeIn 0.28s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.explanation strong { color: var(--accent); }
.explanation.good { background: var(--correct-soft); border-left-color: var(--correct); }
.explanation.good strong { color: var(--correct); }
.explanation.bad  { background: var(--wrong-soft);   border-left-color: var(--wrong); }
.explanation.bad  strong { color: var(--wrong); }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; flex-wrap: wrap; }

/* ── Config screen ────────────────────────────────────────────────── */
.config-card { max-width: 580px; margin: 24px auto; }
.length-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(82px, 1fr)); gap: 7px; margin-top: 10px; }
.length-opt {
  background: var(--surface-raised); border: 1.5px solid var(--border);
  border-radius: 9px; padding: 13px 8px;
  text-align: center; cursor: pointer; font-weight: 600;
  font-family: 'Space Grotesk', sans-serif; color: var(--text);
  transition: border-color 0.12s, background-color 0.12s, box-shadow 0.12s;
}
.length-opt:hover { border-color: var(--brand); }
.length-opt.active {
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px rgba(43,127,255,0.42);
}
.distribution {
  margin-top: 14px; padding: 11px 13px; background: var(--surface-raised);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-soft);
  border: 1px solid var(--border);
}
.distribution strong { color: var(--text); }

/* ── Results screen ───────────────────────────────────────────────── */
.results-hero {
  background: linear-gradient(155deg, #0B1C44 0%, #0E2756 55%, #0B1A40 100%);
  color: #fff; padding: 32px 26px; border-radius: var(--radius);
  text-align: center; margin-bottom: 16px;
  box-shadow: var(--shadow-lg), var(--glow-brand);
  border: 1px solid rgba(43,127,255,0.22);
  position: relative; overflow: hidden;
}
.results-hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 85% 65% at 50% -15%, rgba(43,127,255,0.42) 0%, transparent 60%);
}
.results-hero > * { position: relative; z-index: 1; }
.mascot-results {
  width: 72px; height: 72px; object-fit: contain; margin-bottom: 10px;
  filter: drop-shadow(0 3px 10px rgba(0,0,0,0.4));
  animation: mascotFloat 4s ease-in-out infinite;
}
.results-hero.pass { background: linear-gradient(155deg, #052D18 0%, #065F46 55%, #04231A 100%); border-color: rgba(22,163,74,0.3); box-shadow: var(--shadow-lg), var(--glow-correct); }
.results-hero.pass::before { background: radial-gradient(ellipse 85% 65% at 50% -15%, rgba(22,163,74,0.42) 0%, transparent 60%); }
.results-hero.fail { background: linear-gradient(155deg, #2A0808 0%, #7F1D1D 55%, #1A0606 100%); border-color: rgba(220,38,38,0.3); box-shadow: var(--shadow-lg), var(--glow-wrong); }
.results-hero.fail::before { background: radial-gradient(ellipse 85% 65% at 50% -15%, rgba(220,38,38,0.38) 0%, transparent 60%); }
.big-score {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 68px; font-weight: 800; line-height: 1;
  margin: 10px 0 4px; letter-spacing: -0.04em;
  text-shadow: 0 0 40px rgba(255,255,255,0.22);
}
.score-label { font-size: 13px; opacity: 0.82; }
[data-theme="light"] .results-hero      { background: linear-gradient(155deg, #1E40AF, #1D4ED8, #1E40AF); border-color: rgba(43,127,255,0.3); }
[data-theme="light"] .results-hero.pass { background: linear-gradient(155deg, #166534, #15803D, #14532D); border-color: rgba(22,163,74,0.3); }
[data-theme="light"] .results-hero.fail { background: linear-gradient(155deg, #991B1B, #B91C1C, #7F1D1D); border-color: rgba(220,38,38,0.3); }
.results-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat-tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-tile .tile-val { font-size: 21px; font-weight: 700; color: var(--text); font-family: 'Space Grotesk', sans-serif; }
.stat-tile .tile-val.good { color: var(--correct); }
.stat-tile .tile-val.bad  { color: var(--wrong); }
.stat-tile .tile-label    { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.bd-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.bd-section h3  { padding: 12px 16px; background: var(--surface-raised); margin: 0; font-size: 14px; border-bottom: 1px solid var(--border); }
.bd-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; gap: 10px; }
.bd-row:last-child { border-bottom: none; }
.bd-row .bd-label  { flex: 1; color: var(--text); }
.bd-row .bd-meter  { width: 130px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bd-row .bd-meter > div { height: 100%; background: var(--correct); transition: width 0.5s; border-radius: 3px; }
.bd-row.bad  .bd-meter > div { background: var(--wrong); }
.bd-row.warn .bd-meter > div { background: var(--review); }
.bd-row .bd-pct { width: 46px; text-align: right; font-weight: 700; font-size: 12.5px; font-family: 'Space Grotesk', sans-serif; }

/* ── Dashboard ────────────────────────────────────────────────────── */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
.history-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.history-row {
  display: grid; grid-template-columns: 1fr 96px 76px 68px 76px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  align-items: center; font-size: 13.5px; cursor: pointer;
  transition: background-color 0.12s;
}
.history-row:hover { background: var(--surface-raised); }
.history-row:last-child { border-bottom: none; }
.history-row.header {
  font-size: 10.5px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  background: var(--surface-raised); cursor: default;
  font-family: 'Space Grotesk', sans-serif;
}
.history-row.header:hover { background: var(--surface-raised); }
.ht-type {
  display: inline-block; padding: 2px 7px; border-radius: 9px;
  font-size: 10.5px; font-weight: 700;
  background: var(--brand-soft); color: var(--accent);
  font-family: 'Space Grotesk', sans-serif;
}
.ht-type.exam { background: rgba(217,119,6,0.12); color: var(--review); }
.ht-score { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
.ht-score.good { color: var(--correct); }
.ht-score.warn { color: var(--review); }
.ht-score.bad  { color: var(--wrong); }

/* ── Misc ─────────────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 56px 20px; color: var(--text-soft); }
.empty-state .ico { font-size: 44px; margin-bottom: 10px; opacity: 0.35; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 26px;
  max-width: 410px; width: 100%;
  box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease;
}
.modal h2 { margin-bottom: 10px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

/* ── Responsive ───────────────────────────────────────────────────── */
@media (max-width: 720px) {
  .container { padding: 14px; }
  h1 { font-size: 20px; }
  .filter-section { flex-direction: column; }
  .filter-section .card { flex: 1; width: 100%; max-height: none; }
  .question-card  { padding: 16px; }
  .quiz-progress-bar { padding: 10px 12px; gap: 10px; }
  .qpb-stat { min-width: 46px; }
  .qpb-value { font-size: 14px; }
  .history-row { grid-template-columns: 1fr 68px 56px 56px; font-size: 12.5px; padding: 10px 12px; }
  .history-row > :nth-child(4) { display: none; }
  .topbar { padding: 9px 13px; }
  .topbar .username { display: none; }
}

/* ── Meme popup ───────────────────────────────────────────────────── */
#memePopup {
  position: fixed; top: 72px; right: 18px; width: 262px;
  z-index: 9999; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 8px 28px rgba(0,0,0,0.55), 0 20px 56px rgba(0,0,0,0.3);
  transform: scale(0.38) translateY(-30px) rotate(-4deg);
  opacity: 0; pointer-events: none;
}
#memePopup.meme-visible { animation: memePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards, memeFloat 3s ease-in-out 0.52s infinite; }
#memePopup.meme-correct { box-shadow: 0 0 0 2px var(--correct), 0 8px 28px rgba(0,0,0,0.5), var(--glow-correct); }
#memePopup.meme-wrong   { box-shadow: 0 0 0 2px var(--wrong),   0 8px 28px rgba(0,0,0,0.5), var(--glow-wrong); }
#memePopup.meme-exit    { animation: memeOut 0.36s cubic-bezier(0.4,0,1,1) forwards !important; }
#memePopup img { width: 100%; display: block; max-height: 224px; object-fit: cover; }
.meme-caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 32px 13px 13px;
  background: linear-gradient(to top, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.5) 55%, transparent 100%);
  color: #fff; font-family: 'Poppins', sans-serif;
  font-weight: 700; font-size: 12.5px; line-height: 1.35;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}
@keyframes memePop   { from{transform:scale(0.38) translateY(-30px) rotate(-4deg);opacity:0} to{transform:scale(1) translateY(0) rotate(0deg);opacity:1} }
@keyframes memeFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 33%{transform:translateY(-5px) rotate(0.6deg)} 66%{transform:translateY(3px) rotate(-0.4deg)} }
@keyframes memeOut   { from{transform:scale(1) translateY(0);opacity:1} to{transform:scale(0.78) translateY(14px);opacity:0} }
@media (max-width: 720px) { #memePopup { width: 196px; top: 64px; right: 10px; } }

<script>
/* ── Medical Chemistry question data ── */
const _CHEM_RAW = [{"id":1,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Definition of chemistry","difficulty":"recall","question":"Chemistry is best defined as the study of:","options":{"A":"Only living organisms and their cells","B":"The nature, properties, and transformations of matter","C":"The motion of planets and stars","D":"Mathematical equations of energy only"},"answer":"B","explanation":"Chemistry is the study of the nature, properties, and transformations of matter – anything that has mass and occupies space."},{"id":2,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Aim of medical chemistry","difficulty":"recall","question":"What is the main aim of the Medical Chemistry course?","options":{"A":"To teach surgery techniques","B":"To teach the chemical compounds of living organisms and the reactions in the body","C":"To teach human anatomy only","D":"To teach pharmacology dosing"},"answer":"B","explanation":"The course aims to teach the chemical compounds that make up a living organism, the chemical reactions in the body, and the basics of organic and instrumental chemistry."},{"id":3,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Central science","difficulty":"understanding","question":"Why is chemistry often called the \u0027central science\u0027?","options":{"A":"Because it is the oldest science","B":"Because it is crucial to and connects all other sciences","C":"Because it requires no mathematics","D":"Because only chemists can practice it"},"answer":"B","explanation":"Chemistry is called the central science because it is crucial to all other sciences; the lines between chemistry, biology, and physics fade as research becomes more interdisciplinary."},{"id":4,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Matter","difficulty":"recall","question":"Which statement correctly defines matter?","options":{"A":"Anything that emits light","B":"Anything that has mass and occupies space","C":"Only solid objects","D":"Energy that flows between objects"},"answer":"B","explanation":"Matter is the physical material that makes up the universe – anything that has mass and occupies space."},{"id":5,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Physical vs chemical change","difficulty":"understanding","question":"Which of the following is a PHYSICAL change?","options":{"A":"Iron rusting in air","B":"Wood burning","C":"Ice melting into liquid water","D":"Potassium reacting with water"},"answer":"C","explanation":"A physical change does not affect the chemical makeup of a substance. Melting ice changes only its state, not its chemical identity."},{"id":6,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Chemical change","difficulty":"understanding","question":"Burning of potassium in water is an example of a:","options":{"A":"Physical change","B":"Chemical change","C":"Change of state only","D":"Nuclear reaction"},"answer":"B","explanation":"Burning of potassium in water alters the chemical makeup of the substances, producing new substances; it is therefore a chemical change."},{"id":7,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"States of matter","difficulty":"recall","question":"Which physical state has a definite volume but an indefinite shape?","options":{"A":"Solid","B":"Liquid","C":"Gas","D":"Plasma"},"answer":"B","explanation":"A liquid has a definite volume but takes the shape of its container (indefinite shape). A solid has both definite volume and shape; a gas has neither."},{"id":8,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"States of matter","difficulty":"recall","question":"A gas is characterized by having:","options":{"A":"A definite volume and definite shape","B":"A definite volume but indefinite shape","C":"Neither a definite volume nor a definite shape","D":"A definite shape but indefinite volume"},"answer":"C","explanation":"A gas has neither a definite volume nor a definite shape; it expands to fill its container."},{"id":9,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Pure substance vs mixture","difficulty":"understanding","question":"Honey is best classified as a:","options":{"A":"Pure substance","B":"Single element","C":"Mixture composed mostly of sugar and water","D":"Compound with a fixed formula"},"answer":"C","explanation":"Although sugar and water individually are pure substances, honey is a mixture made mostly of sugar and water."},{"id":10,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Chemical formula","difficulty":"recall","question":"A chemical formula uses element symbols and subscripts to show:","options":{"A":"The color of a compound","B":"How many atoms of each element are present","C":"The temperature of a reaction","D":"The price of a substance"},"answer":"B","explanation":"A chemical formula is a notation using element symbols and subscripts to show how many atoms of each element are present in a compound."},{"id":11,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Dalton\u0027s atomic theory","difficulty":"recall","question":"According to Dalton\u0027s atomic theory, chemical reactions:","options":{"A":"Create new atoms","B":"Destroy atoms","C":"Only change the way atoms are combined; the atoms themselves are unchanged","D":"Convert atoms into energy"},"answer":"C","explanation":"Dalton\u0027s atomic theory states that chemical reactions change only how atoms are combined; the atoms themselves are neither created, destroyed, nor changed."},{"id":12,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Dalton\u0027s atomic theory","difficulty":"recall","question":"Which statement is part of Dalton\u0027s atomic theory?","options":{"A":"Atoms of a given element are identical to atoms of other elements","B":"All matter is composed of atoms","C":"Atoms can be created in chemical reactions","D":"Compounds combine atoms in random, variable ratios"},"answer":"B","explanation":"A key postulate is that all matter is composed of atoms; atoms of different elements differ, and compounds combine atoms in fixed whole-number ratios."},{"id":13,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Atomic structure","difficulty":"understanding","question":"Where is virtually all the mass of an atom concentrated?","options":{"A":"In the electron cloud","B":"In the nucleus (protons and neutrons)","C":"Evenly spread throughout the atom","D":"In the empty space around the atom"},"answer":"B","explanation":"Protons and neutrons are packed in the nucleus, where virtually all of an atom\u0027s mass is concentrated; electrons occupy the large surrounding volume."},{"id":14,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Atomic mass standard","difficulty":"recall","question":"The relative atomic mass scale is based on a carbon atom containing 6 protons and 6 neutrons, which is assigned a mass of exactly:","options":{"A":"1 amu","B":"6 amu","C":"12 amu","D":"24 amu"},"answer":"C","explanation":"Carbon-12 is assigned a mass of exactly 12 atomic mass units (amu), which serves as the reference for the relative atomic mass scale."},{"id":15,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Isotopes","difficulty":"recall","question":"Isotopes are atoms with:","options":{"A":"Identical mass numbers but different atomic numbers","B":"Identical atomic numbers but different mass numbers","C":"Different numbers of protons and electrons","D":"The same number of neutrons but different protons"},"answer":"B","explanation":"Isotopes have the same atomic number (same number of protons) but different mass numbers because they have different numbers of neutrons."},{"id":16,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Density","difficulty":"recall","question":"Density is the physical property that relates:","options":{"A":"Mass to volume","B":"Mass to temperature","C":"Volume to pressure","D":"Energy to time"},"answer":"A","explanation":"Density relates mass to volume and is expressed in g/mL for liquids or g/cm³ for solids."},{"id":17,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Property","difficulty":"recall","question":"In chemistry, a \u0027property\u0027 is best described as:","options":{"A":"A reaction that releases energy","B":"A characteristic useful for identifying a substance or object","C":"A type of chemical bond","D":"The container that holds a substance"},"answer":"B","explanation":"A property is a characteristic that is useful for identifying a substance or object (e.g., color, density, melting point)."},{"id":18,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Scientific method","difficulty":"understanding","question":"Knowledge of chemistry has developed mainly through the application of:","options":{"A":"Random guessing","B":"The scientific method","C":"Religious doctrine","D":"Economic theory"},"answer":"B","explanation":"Our knowledge of chemistry, like other sciences, developed through the scientific method."},{"id":19,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"Synthetic vs natural","difficulty":"understanding","question":"Plastics, synthetic fibers, and many modern medicines are examples of substances that:","options":{"A":"Occur abundantly in nature","B":"Were created in the chemical laboratory and do not occur in nature","C":"Are not made of chemicals","D":"Cannot be analyzed by chemistry"},"answer":"B","explanation":"Many plastics, fibers, and medicines do not occur naturally but were created in the laboratory, illustrating how chemistry produces new materials."},{"id":20,"lecture":"Lecture 1 - Subject of Medical Chemistry, Matter \u0026 Atoms","topic":"amu value","difficulty":"application","question":"One atomic mass unit (amu), also called a dalton, is approximately equal to:","options":{"A":"1.66 × 10⁻²⁴ g","B":"6.02 × 10²³ g","C":"9.11 × 10⁻³¹ g","D":"1.00 g"},"answer":"A","explanation":"1 amu = 1.66 × 10⁻²⁴ g, defined as one-twelfth the mass of a carbon-12 atom."},{"id":21,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Reactions in living organisms","difficulty":"recall","question":"Which of the following is a chemical reaction that takes place in living organisms?","options":{"A":"Cellular respiration","B":"Erosion of rocks","C":"Melting of metals","D":"Evaporation of seawater"},"answer":"A","explanation":"Cellular respiration, photosynthesis, and ATP hydrolysis are key chemical reactions occurring in living organisms."},{"id":22,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Law of conservation of mass","difficulty":"recall","question":"The law of conservation of mass states that in a chemical reaction, matter is:","options":{"A":"Created from energy","B":"Neither created nor destroyed","C":"Always destroyed","D":"Converted into light"},"answer":"B","explanation":"By the law of conservation of mass, atoms are only rearranged in reactions; matter is neither created nor destroyed."},{"id":23,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Combination reaction","difficulty":"understanding","question":"In a combination reaction:","options":{"A":"A reactant splits into simpler products","B":"Two or more elements or compounds bond to form one product","C":"Electrons are transferred between substances","D":"A fuel burns in oxygen"},"answer":"B","explanation":"In a combination (synthesis) reaction, two or more elements or compounds combine to form a single product."},{"id":24,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Decomposition reaction","difficulty":"understanding","question":"A decomposition reaction is one in which:","options":{"A":"Two compounds exchange ions","B":"A reactant splits into two or more simpler products","C":"An element replaces another in a compound","D":"A compound burns to give CO2 and water"},"answer":"B","explanation":"In a decomposition reaction a single reactant breaks down into two or more simpler products."},{"id":25,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Single replacement","difficulty":"understanding","question":"In a single replacement reaction:","options":{"A":"Positive ions in two compounds switch places","B":"A reacting element switches place with an element in another compound","C":"Two elements combine into one product","D":"A compound decomposes on heating"},"answer":"B","explanation":"In a single replacement reaction, one element takes the place of another element within a compound."},{"id":26,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Double replacement","difficulty":"understanding","question":"A double replacement reaction is characterized by:","options":{"A":"The positive ions in the reacting compounds switching places","B":"An element combining with oxygen","C":"Loss of electrons only","D":"Splitting of a single reactant"},"answer":"A","explanation":"In a double replacement reaction, the positive ions (cations) of the two reacting compounds exchange partners."},{"id":27,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Combustion reaction","difficulty":"understanding","question":"In a typical combustion reaction, a carbon-containing fuel burns in oxygen to produce:","options":{"A":"Hydrogen gas and metal","B":"Carbon dioxide, water, and energy","C":"Only carbon and water","D":"Ammonia and salt"},"answer":"B","explanation":"Combustion of a carbon-containing fuel in oxygen yields carbon dioxide (CO2), water (H2O), and energy as heat or flame."},{"id":28,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Redox - oxidation","difficulty":"recall","question":"Oxidation is defined as the:","options":{"A":"Gain of one or more electrons","B":"Loss of one or more electrons","C":"Gain of protons","D":"Loss of neutrons"},"answer":"B","explanation":"Oxidation is the loss of electrons; reduction is the gain of electrons (remember \u0027OIL RIG\u0027)."},{"id":29,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Redox - reduction","difficulty":"recall","question":"In a redox reaction, the substance that gains electrons is said to be:","options":{"A":"Oxidized","B":"Reduced","C":"Neutralized","D":"Decomposed"},"answer":"B","explanation":"Reduction is the gain of one or more electrons by an atom; the substance that gains electrons is reduced."},{"id":30,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Redox coupling","difficulty":"understanding","question":"In any oxidation–reduction reaction, if one substance loses electrons, then another substance must:","options":{"A":"Also lose electrons","B":"Gain those electrons","C":"Remain unchanged","D":"Be destroyed"},"answer":"B","explanation":"Electrons transferred from one substance must be gained by another; oxidation and reduction always occur together."},{"id":31,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Forms of energy","difficulty":"recall","question":"The two fundamental, interconvertible kinds of energy are:","options":{"A":"Heat and light","B":"Potential and kinetic energy","C":"Electrical and nuclear energy","D":"Chemical and magnetic energy"},"answer":"B","explanation":"Energy exists fundamentally as potential (stored) energy and kinetic (motion) energy, which can convert into one another."},{"id":32,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Potential energy","difficulty":"understanding","question":"Which of the following is an example of stored (potential) energy?","options":{"A":"Water falling over a dam","B":"A coiled spring","C":"A rolling car","D":"Hands moving on a clock"},"answer":"B","explanation":"A coiled spring, water held behind a dam, and a car poised at the top of a hill store potential energy until it is released as kinetic energy."},{"id":33,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Chemical bonds as energy","difficulty":"understanding","question":"In chemical compounds, the attractive forces between ions or atoms (bonds) are a form of:","options":{"A":"Kinetic energy","B":"Potential energy","C":"Nuclear energy","D":"Light energy"},"answer":"B","explanation":"The attractive forces in ionic and covalent bonds represent stored potential energy, often converted to heat during reactions."},{"id":34,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Bond dissociation energy","difficulty":"recall","question":"Bond dissociation energy is the amount of energy that must be supplied to:","options":{"A":"Form a bond between atoms","B":"Break a bond and separate the atoms in a gaseous molecule","C":"Melt a solid","D":"Ionize a metal"},"answer":"B","explanation":"Bond dissociation energy is the energy required to break a bond and separate the atoms in an isolated gaseous molecule; it measures bond strength."},{"id":35,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Bond strength","difficulty":"application","question":"The N≡N triple bond in N2 has a bond dissociation energy of 226 kcal/mol, while the Cl–Cl single bond has 58 kcal/mol. This explains why:","options":{"A":"Nitrogen reacts more readily than chlorine","B":"Chlorine reacts more readily than nitrogen, whose strong triple bond is hard to break","C":"Both react at the same rate","D":"Neither molecule can react"},"answer":"B","explanation":"Because the N≡N triple bond is much stronger, it is harder to break, so nitrogen is relatively unreactive while chlorine\u0027s weaker single bond breaks more easily."},{"id":36,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Endothermic","difficulty":"recall","question":"A chemical change that absorbs heat is described as:","options":{"A":"Exothermic","B":"Endothermic","C":"Spontaneous","D":"Catalytic"},"answer":"B","explanation":"Endothermic (from Greek \u0027endon\u0027 = within) means heat is absorbed/put in; bond breaking is endothermic."},{"id":37,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Exothermic","difficulty":"recall","question":"Bond formation is a process that:","options":{"A":"Absorbs heat and is endothermic","B":"Releases heat and is exothermic","C":"Neither absorbs nor releases energy","D":"Destroys atoms"},"answer":"B","explanation":"Bond formation releases heat and is exothermic; the energy released in forming a bond equals the energy absorbed in breaking it."},{"id":38,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Enthalpy sign","difficulty":"understanding","question":"For an exothermic reaction, the sign of ΔH (enthalpy change) is:","options":{"A":"Positive","B":"Negative","C":"Zero","D":"Always equal to ΔG"},"answer":"B","explanation":"An exothermic reaction releases heat to the surroundings, so ΔH is negative. An endothermic reaction has a positive ΔH."},{"id":39,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Heat of reaction","difficulty":"recall","question":"The difference between the energy absorbed in breaking bonds and the energy released in forming bonds is called the:","options":{"A":"Activation energy","B":"Heat of reaction (enthalpy change, ΔH)","C":"Entropy","D":"Equilibrium constant"},"answer":"B","explanation":"The heat of reaction, or enthalpy change (ΔH), is the net difference between energy used to break bonds and energy released forming new bonds."},{"id":40,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Reverse reaction enthalpy","difficulty":"application","question":"If a forward reaction releases 50 kcal/mol of heat, its reverse reaction will:","options":{"A":"Release 50 kcal/mol","B":"Absorb 50 kcal/mol (same magnitude, opposite sign)","C":"Release 100 kcal/mol","D":"Have no heat change"},"answer":"B","explanation":"The heat of the reverse reaction equals that of the forward reaction in magnitude but has the opposite sign; an exothermic forward reaction has an endothermic reverse."},{"id":41,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Spontaneous process","difficulty":"understanding","question":"A spontaneous process in chemistry is one that:","options":{"A":"Always occurs very quickly","B":"Once started, proceeds on its own without external influence","C":"Requires continuous outside energy","D":"Cannot occur in nature"},"answer":"B","explanation":"A spontaneous process proceeds on its own once started, without external influence; it may be fast (uncoiling spring) or slow (rusting)."},{"id":42,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Entropy","difficulty":"recall","question":"Entropy (S) is a measure of the amount of:","options":{"A":"Heat content of a system","B":"Molecular disorder in a system","C":"Mass in a reaction","D":"Bond strength"},"answer":"B","explanation":"Entropy (S) measures the molecular disorder of a system; it increases when, e.g., a gas forms from a solid or moles of product exceed moles of reactant."},{"id":43,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Entropy increase","difficulty":"application","question":"Entropy typically increases when:","options":{"A":"A gas condenses into a liquid","B":"2 mol of reactants form 4 mol of products","C":"Atoms become more ordered","D":"Temperature decreases"},"answer":"B","explanation":"Producing more moles (especially gas) from fewer increases disorder, so entropy increases."},{"id":44,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Free energy and spontaneity","difficulty":"recall","question":"Which quantity ultimately determines whether a reaction is spontaneous?","options":{"A":"The activation energy","B":"The free-energy change (ΔG)","C":"The bond dissociation energy","D":"The reaction rate"},"answer":"B","explanation":"The free-energy change (ΔG), which combines enthalpy and entropy effects, determines spontaneity."},{"id":45,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Gibbs free energy sign","difficulty":"understanding","question":"A reaction is spontaneous (exergonic) when its free-energy change ΔG is:","options":{"A":"Positive","B":"Negative","C":"Zero","D":"Equal to the activation energy"},"answer":"B","explanation":"A negative ΔG indicates a spontaneous, exergonic reaction that releases energy; a positive ΔG indicates a non-spontaneous, endergonic reaction."},{"id":46,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"ΔG and rate","difficulty":"understanding","question":"A favorable (negative) free-energy change tells us that a reaction:","options":{"A":"Will definitely occur rapidly","B":"Can occur, but says nothing about how fast it will happen","C":"Is impossible","D":"Will never reach equilibrium"},"answer":"B","explanation":"ΔG indicates only whether a reaction can occur, not its speed; a reaction can be thermodynamically favorable yet very slow."},{"id":47,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"First law of thermodynamics","difficulty":"recall","question":"The law of conservation of energy (first law of thermodynamics) states that energy:","options":{"A":"Can be created but not destroyed","B":"Cannot be created or destroyed, only transferred or transformed","C":"Is always lost as mass","D":"Increases in every reaction"},"answer":"B","explanation":"Energy cannot be created or destroyed; it can only be transferred or transformed – the basis of the first law of thermodynamics."},{"id":48,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Energy coupling in cells","difficulty":"application","question":"Living organisms drive energy-requiring (endergonic) reactions by coupling them with:","options":{"A":"Other endergonic reactions","B":"Exergonic reactions such as ATP hydrolysis","C":"Physical changes only","D":"Decomposition of water"},"answer":"B","explanation":"Cells couple exergonic reactions (e.g., ATP hydrolysis, ΔG \u003c 0) with endergonic processes such as protein synthesis, muscle contraction, and active transport."},{"id":49,"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Second law in biology","difficulty":"understanding","question":"According to the second law of thermodynamics, in any energy transformation the total entropy of a system and its surroundings:","options":{"A":"Always decreases","B":"Always increases","C":"Stays exactly constant","D":"Becomes zero"},"answer":"B","explanation":"The second law states that the total entropy of a system plus its surroundings always increases; biological processes lose some energy as heat, raising overall entropy."},{"id":50,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Collision requirement","difficulty":"understanding","question":"For a chemical reaction to occur, reactant particles must collide and also:","options":{"A":"Have any orientation whatsoever","B":"Approach with the correct orientation and sufficient energy","C":"Be at absolute zero temperature","D":"Be in the solid state"},"answer":"B","explanation":"Not all collisions are productive; molecules must collide with the correct orientation and enough energy to overcome the activation barrier."},{"id":51,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Activation energy","difficulty":"recall","question":"The minimum energy that colliding particles must have for a productive collision is called the:","options":{"A":"Free energy","B":"Activation energy","C":"Bond energy","D":"Entropy"},"answer":"B","explanation":"Activation energy is the height of the energy barrier between reactants and products that must be surmounted for a reaction to occur."},{"id":52,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Activation energy and rate","difficulty":"understanding","question":"Reactions with low activation energies generally:","options":{"A":"Go faster than reactions with high activation energies","B":"Go slower than reactions with high activation energies","C":"Do not occur at all","D":"Have negative reaction rates"},"answer":"A","explanation":"The size of the activation energy determines the reaction rate; lower activation energy means a faster reaction."},{"id":53,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"E vs ΔG independence","difficulty":"application","question":"A reaction with a large negative ΔG but a large activation energy will:","options":{"A":"Always proceed instantly","B":"Proceed very slowly despite being thermodynamically favorable","C":"Not be spontaneous","D":"Have no products"},"answer":"B","explanation":"Activation energy and free-energy change are unrelated. A large negative ΔG favors the reaction thermodynamically, but a high activation energy makes it slow."},{"id":54,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Measuring rate","difficulty":"recall","question":"The rate of a reaction is determined by measuring:","options":{"A":"The total mass of the container","B":"The amount of reactant used up or product formed per unit time","C":"The color of the products only","D":"The pH at the start"},"answer":"B","explanation":"Reaction rate is measured as the amount of a reactant consumed, or product formed, in a given period of time."},{"id":55,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Temperature effect","difficulty":"understanding","question":"Raising the temperature increases reaction rate mainly because it:","options":{"A":"Lowers the activation energy","B":"Increases the frequency and force of collisions","C":"Decreases the number of molecules","D":"Removes the catalyst"},"answer":"B","explanation":"Higher temperature gives reactants more energy so they move faster, increasing both the frequency and the force of collisions, making them more likely to overcome the activation barrier."},{"id":56,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Concentration effect","difficulty":"understanding","question":"Increasing the concentration of reactants speeds up a reaction because:","options":{"A":"It lowers the activation energy","B":"Reactant molecules are crowded together, so collisions become more frequent","C":"It changes the products formed","D":"It cools the reaction"},"answer":"B","explanation":"Higher concentration crowds reactant molecules together, increasing collision frequency and therefore reaction rate."},{"id":57,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Catalyst definition","difficulty":"recall","question":"A catalyst is a substance that:","options":{"A":"Is consumed during the reaction","B":"Accelerates a reaction but is itself unchanged in the process","C":"Always slows reactions down","D":"Raises the activation energy"},"answer":"B","explanation":"A catalyst speeds up a reaction without being consumed; it provides an alternative pathway with lower activation energy or orients molecules favorably."},{"id":58,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"How catalysts work","difficulty":"understanding","question":"A catalyst increases reaction rate by:","options":{"A":"Raising the energy level of the products","B":"Providing an alternative pathway with lower activation energy","C":"Increasing the ΔG of the reaction","D":"Adding mass to the reactants"},"answer":"B","explanation":"A catalyst does not change the energy level of reactants or products; it lowers the activation energy (or orients molecules), increasing rate."},{"id":59,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Enzymes","difficulty":"recall","question":"In the body, the biological catalysts that speed up biochemical reactions are:","options":{"A":"Hormones","B":"Enzymes (large protein molecules)","C":"Vitamins only","D":"Electrolytes"},"answer":"B","explanation":"Enzymes are large protein molecules that catalyze biochemical reactions, mainly by controlling the orientation of reacting molecules."},{"id":60,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Enzyme specificity","difficulty":"understanding","question":"A characteristic feature of enzymes is that:","options":{"A":"One enzyme catalyzes every reaction in the body","B":"Almost every reaction is catalyzed by its own specific enzyme","C":"They are consumed in each reaction","D":"They raise activation energy"},"answer":"B","explanation":"Enzymes are highly specific; almost every biochemical reaction has its own specific enzyme, which is why enzyme study is central to biochemistry."},{"id":61,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Reversible reaction","difficulty":"recall","question":"A reversible reaction is indicated in an equation by:","options":{"A":"A single forward arrow","B":"A double arrow","C":"An equals sign","D":"A plus sign"},"answer":"B","explanation":"A reversible reaction, which can go in either direction, is shown with a double arrow; left-to-right is the forward reaction and right-to-left is the reverse."},{"id":62,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Chemical equilibrium","difficulty":"understanding","question":"Chemical equilibrium is reached when:","options":{"A":"All reactants are completely consumed","B":"The concentrations of reactants and products undergo no further change","C":"The forward reaction stops completely","D":"Temperature drops to zero"},"answer":"B","explanation":"At equilibrium the concentrations of reactants and products remain constant because the forward and reverse reactions occur at equal rates (not because they stop)."},{"id":63,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Equilibrium - dynamic","difficulty":"understanding","question":"At equilibrium, the forward and reverse reactions:","options":{"A":"Have both stopped completely","B":"Continue to occur but at equal rates","C":"Occur only in the forward direction","D":"Occur only in the reverse direction"},"answer":"B","explanation":"Equilibrium is dynamic: forward and reverse reactions continue, but at equal rates, so net concentrations stay constant."},{"id":64,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Equilibrium constant","difficulty":"recall","question":"The equilibrium constant (K) is obtained from the ratio of the concentrations of:","options":{"A":"Reactants over products","B":"Products over reactants, each raised to its coefficient","C":"Only the gases present","D":"Catalysts over enzymes"},"answer":"B","explanation":"K is the ratio of product concentrations to reactant concentrations, each raised to a power equal to its coefficient in the balanced equation, at a given temperature."},{"id":65,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"K interpretation","difficulty":"application","question":"A large value of the equilibrium constant K indicates that at equilibrium:","options":{"A":"Reactants are favored","B":"Products are favored","C":"No reaction occurs","D":"Only catalysts remain"},"answer":"B","explanation":"Because K is the ratio of products to reactants, a large K means product concentrations dominate, so products are favored at equilibrium."},{"id":66,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Le Chatelier\u0027s principle","difficulty":"recall","question":"Le Châtelier\u0027s principle states that when a stress is applied to a system at equilibrium, the equilibrium:","options":{"A":"Stays exactly the same","B":"Shifts to relieve the stress","C":"Stops completely","D":"Reverses permanently"},"answer":"B","explanation":"Le Châtelier\u0027s principle: when a stress (change in concentration, pressure, volume, or temperature) is applied, the equilibrium shifts in the direction that relieves the stress."},{"id":67,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Stress definition","difficulty":"understanding","question":"In the context of Le Châtelier\u0027s principle, a \u0027stress\u0027 is any change in:","options":{"A":"Color or odor","B":"Concentration, pressure, volume, or temperature","C":"The catalyst\u0027s color","D":"The container\u0027s shape"},"answer":"B","explanation":"A \u0027stress\u0027 is any change in concentration, pressure, volume, or temperature that disturbs the equilibrium and makes forward and reverse rates temporarily unequal."},{"id":68,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Adding reactant - shift","difficulty":"application","question":"If more reactant is added to a system at equilibrium, the equilibrium will shift:","options":{"A":"Toward the reactants","B":"Toward the products (forward)","C":"It will not change","D":"Toward stopping the reaction"},"answer":"B","explanation":"By Le Châtelier\u0027s principle, adding reactant is a stress that the system relieves by shifting forward to form more product."},{"id":69,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Complete vs reversible","difficulty":"understanding","question":"When sodium metal reacts with chlorine gas, both are completely consumed because:","options":{"A":"The product is far less stable than reactants","B":"The sodium chloride product is much more stable than the reactants","C":"The reaction is reversible","D":"There is no activation energy"},"answer":"B","explanation":"NaCl is so much more stable than the reactants that, once started, the reaction goes to completion rather than reaching a balanced equilibrium."},{"id":70,"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Factors affecting rate summary","difficulty":"recall","question":"Which of the following does NOT generally increase the rate of a chemical reaction?","options":{"A":"Increasing temperature","B":"Increasing reactant concentration","C":"Adding an appropriate catalyst","D":"Decreasing the temperature"},"answer":"D","explanation":"Reaction rate increases with higher temperature, higher concentration, and added catalysts. Lowering the temperature slows the reaction."},{"id":71,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Solution components","difficulty":"recall","question":"In a solution, the substance present in the larger amount that does the dissolving is the:","options":{"A":"Solute","B":"Solvent","C":"Precipitate","D":"Catalyst"},"answer":"B","explanation":"The solvent is the dissolving medium (usually present in larger amount); the solute is the substance dissolved in it."},{"id":72,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Like dissolves like","difficulty":"understanding","question":"The general rule \u0027like dissolves like\u0027 means that:","options":{"A":"Polar solvents dissolve polar/ionic solutes; nonpolar solvents dissolve nonpolar solutes","B":"All substances dissolve equally in water","C":"Only gases dissolve in liquids","D":"Solubility does not depend on polarity"},"answer":"A","explanation":"\u0027Like dissolves like\u0027: polar/ionic solutes dissolve in polar solvents (e.g., water), while nonpolar solutes dissolve in nonpolar solvents."},{"id":73,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Iodine + KI","difficulty":"application","question":"Iodine is only sparingly soluble in water but dissolves readily when potassium iodide is added because:","options":{"A":"KI raises the temperature","B":"Iodide ions react with I2 to form the more soluble triiodide ion, increasing solubility","C":"KI removes all the water","D":"Iodine becomes a gas"},"answer":"B","explanation":"Iodide (I⁻) from KI combines with I2 to form the soluble triiodide ion (I3⁻), greatly increasing iodine\u0027s apparent solubility in water."},{"id":74,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Factors affecting solubility","difficulty":"recall","question":"Which factor influences the solubility of a substance in a given solvent?","options":{"A":"Temperature","B":"Pressure (for gases)","C":"Nature/polarity of solute and solvent","D":"All of the above"},"answer":"D","explanation":"Solubility depends on the nature (polarity) of solute and solvent, temperature, and – for gases – pressure."},{"id":75,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Temperature \u0026 solid solubility","difficulty":"understanding","question":"For most solid solutes dissolving in water, increasing the temperature usually:","options":{"A":"Decreases solubility","B":"Increases solubility","C":"Has no effect","D":"Turns the solid into a gas"},"answer":"B","explanation":"The solubility of most solids in water increases as temperature rises, because added energy helps break solute–solute interactions."},{"id":76,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Gas solubility \u0026 temperature","difficulty":"understanding","question":"Unlike most solids, the solubility of a gas in a liquid generally:","options":{"A":"Increases as temperature increases","B":"Decreases as temperature increases","C":"Is unaffected by temperature","D":"Becomes infinite when heated"},"answer":"B","explanation":"Gas solubility decreases with rising temperature – warm liquids hold less dissolved gas (e.g., warm soda goes flat faster)."},{"id":77,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Henry\u0027s law","difficulty":"recall","question":"Henry\u0027s law states that the solubility of a gas in a liquid is directly proportional to the:","options":{"A":"Temperature of the gas","B":"Partial pressure of the gas above the liquid","C":"Volume of the container","D":"Color of the solution"},"answer":"B","explanation":"Henry\u0027s law: the amount of gas dissolved in a liquid is directly proportional to the partial pressure of that gas above the liquid."},{"id":78,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Colligative properties","difficulty":"recall","question":"Colligative properties of solutions depend on:","options":{"A":"The chemical identity of the solute","B":"The number of dissolved solute particles, not their identity","C":"The color of the solute","D":"Only the solvent\u0027s density"},"answer":"B","explanation":"Colligative properties (e.g., boiling point elevation, freezing point depression, osmotic pressure) depend on the number of dissolved particles, not their identity."},{"id":79,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Raoult / boiling point","difficulty":"understanding","question":"Adding a nonvolatile solute to a solvent generally causes the solution\u0027s boiling point to:","options":{"A":"Decrease","B":"Increase (boiling point elevation)","C":"Stay the same","D":"Become undefined"},"answer":"B","explanation":"A nonvolatile solute lowers the solvent\u0027s vapor pressure (Raoult\u0027s law), which raises the boiling point – a colligative property called boiling point elevation."},{"id":80,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Freezing point depression","difficulty":"understanding","question":"Dissolving salt in water lowers its freezing point. This colligative property is called:","options":{"A":"Boiling point elevation","B":"Freezing point depression","C":"Osmotic pressure","D":"Vapor pressure increase"},"answer":"B","explanation":"Solute particles interfere with the formation of the solid lattice, so the freezing point is depressed – why salt melts ice on roads."},{"id":81,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Semipermeable membrane","difficulty":"recall","question":"A semipermeable membrane is one that:","options":{"A":"Blocks everything, including water","B":"Allows water and small molecules through but blocks large solute molecules or ions","C":"Allows only large proteins through","D":"Allows nothing to pass"},"answer":"B","explanation":"Semipermeable membranes (like cell membranes) let water and small molecules pass while blocking large solute molecules or ions."},{"id":82,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Osmosis","difficulty":"recall","question":"Osmosis is the movement of:","options":{"A":"Solute molecules across a semipermeable membrane","B":"Solvent molecules across a semipermeable membrane","C":"Large proteins through a membrane","D":"Gases through a solid"},"answer":"B","explanation":"Osmosis is the passage of solvent (water) molecules through a semipermeable membrane, favored from the pure solvent (or dilute) side toward the more concentrated solution."},{"id":83,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Direction of osmosis","difficulty":"understanding","question":"During osmosis, net solvent flow is favored from the:","options":{"A":"Concentrated solution to the dilute side","B":"Pure solvent / dilute side toward the more concentrated solution","C":"Solid to the liquid","D":"Gas to the liquid"},"answer":"B","explanation":"Solvent passes in both directions, but net flow is from the pure solvent (dilute) side to the solution (concentrated) side, diluting the solution."},{"id":84,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Osmolarity","difficulty":"recall","question":"Osmolarity is defined as:","options":{"A":"The mass of solute per liter","B":"The sum of the molarities of all dissolved particles in 1.0 L of solution","C":"The pH of the solution","D":"The boiling point of the solution"},"answer":"B","explanation":"Osmolarity (osmol/L) is the sum of the molarities of all dissolved particles (osmoles) in one liter of solution."},{"id":85,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Isotonic","difficulty":"recall","question":"Two solutions that have the same osmolarity are described as:","options":{"A":"Hypotonic","B":"Hypertonic","C":"Isotonic","D":"Saturated"},"answer":"C","explanation":"Isotonic solutions have equal osmolarity; cells placed in an isotonic fluid neither swell nor shrink."},{"id":86,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Hypotonic","difficulty":"application","question":"A red blood cell placed in a hypotonic solution will tend to:","options":{"A":"Shrink (crenate)","B":"Swell and possibly burst","C":"Remain unchanged","D":"Turn into a gas"},"answer":"B","explanation":"A hypotonic solution has lower osmolarity than the cell, so water flows into the cell, causing it to swell and possibly rupture (hemolysis)."},{"id":87,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Hypertonic","difficulty":"application","question":"A cell placed in a hypertonic solution will:","options":{"A":"Swell and burst","B":"Lose water and shrink","C":"Stay exactly the same size","D":"Gain solute and grow"},"answer":"B","explanation":"A hypertonic solution has higher osmolarity than the cell, so water leaves the cell, causing it to shrink (crenation)."},{"id":88,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Importance of osmolarity in cells","difficulty":"understanding","question":"Why must th
