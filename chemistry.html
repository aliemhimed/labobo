e fluids inside and outside cells have the same osmolarity?","options":{"A":"To keep cells warm","B":"To prevent osmotic pressure buildup and rupture of the cell membrane","C":"To increase reaction rates","D":"To change the cell\u0027s color"},"answer":"B","explanation":"Because cell membranes are semipermeable, matching osmolarity prevents excessive osmotic pressure that could swell and rupture (or shrink) the cell."},{"id":89,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Dialysis","difficulty":"recall","question":"Dialysis differs from osmosis in that the membrane used in dialysis:","options":{"A":"Blocks all molecules including water","B":"Has larger pores allowing solvent and small dissolved molecules through but blocking proteins and large particles","C":"Allows only proteins through","D":"Is completely impermeable"},"answer":"B","explanation":"In dialysis the membrane has a larger pore size, letting solvent and small dissolved molecules pass while blocking proteins and larger particles."},{"id":90,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Clinical dialysis","difficulty":"application","question":"Dialysis is commonly used clinically to:","options":{"A":"Add proteins to the blood","B":"Remove metabolic waste products from the blood","C":"Increase blood glucose","D":"Raise body temperature"},"answer":"B","explanation":"Dialysis is used to remove small metabolic waste products from the blood while retaining large molecules like proteins – the basis of kidney dialysis."},{"id":91,"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Iodine solution use","difficulty":"recall","question":"Iodine solution is used in medicine mainly as a(n):","options":{"A":"Antiseptic and disinfectant","B":"Painkiller","C":"Anesthetic gas","D":"Vitamin supplement"},"answer":"A","explanation":"Iodine solution is an antiseptic and disinfectant used to treat and prevent infection in wounds and cuts by killing harmful microbes."},{"id":92,"lecture":"Lecture 5 - Acids and Bases","topic":"Arrhenius acid","difficulty":"recall","question":"According to the Arrhenius theory, an acid is a substance that produces ____ in water.","options":{"A":"Hydroxide ions (OH⁻)","B":"Hydrogen ions (H⁺)","C":"Sodium ions","D":"Electrons"},"answer":"B","explanation":"An Arrhenius acid increases the concentration of hydrogen ions (H⁺) in aqueous solution; an Arrhenius base produces hydroxide ions (OH⁻)."},{"id":93,"lecture":"Lecture 5 - Acids and Bases","topic":"Arrhenius base","difficulty":"recall","question":"An Arrhenius base produces which ion in aqueous solution?","options":{"A":"H⁺","B":"OH⁻","C":"Cl⁻","D":"Na⁺"},"answer":"B","explanation":"An Arrhenius base increases the concentration of hydroxide ions (OH⁻) when dissolved in water."},{"id":94,"lecture":"Lecture 5 - Acids and Bases","topic":"Bronsted-Lowry acid","difficulty":"recall","question":"In the Brønsted–Lowry theory, an acid is defined as a:","options":{"A":"Proton (H⁺) donor","B":"Proton (H⁺) acceptor","C":"Electron-pair donor","D":"Electron-pair acceptor"},"answer":"A","explanation":"A Brønsted–Lowry acid donates a proton (H⁺); a Brønsted–Lowry base accepts a proton."},{"id":95,"lecture":"Lecture 5 - Acids and Bases","topic":"Bronsted-Lowry base","difficulty":"recall","question":"A Brønsted–Lowry base is a substance that:","options":{"A":"Donates a proton","B":"Accepts a proton (H⁺)","C":"Accepts an electron pair","D":"Releases hydroxide only"},"answer":"B","explanation":"A Brønsted–Lowry base accepts a proton (H⁺). This definition is broader than Arrhenius because it does not require water or OH⁻."},{"id":96,"lecture":"Lecture 5 - Acids and Bases","topic":"Lewis acid","difficulty":"recall","question":"According to Lewis theory, an acid is an:","options":{"A":"Electron-pair acceptor","B":"Electron-pair donor","C":"Proton donor only","D":"Hydroxide producer"},"answer":"A","explanation":"A Lewis acid is an electron-pair acceptor, while a Lewis base is an electron-pair donor – the broadest of the three acid–base definitions."},{"id":97,"lecture":"Lecture 5 - Acids and Bases","topic":"Lewis base","difficulty":"recall","question":"A Lewis base is best described as a substance that:","options":{"A":"Accepts an electron pair","B":"Donates an electron pair","C":"Donates a proton","D":"Produces H⁺ in water"},"answer":"B","explanation":"A Lewis base donates an electron pair to form a coordinate covalent bond with a Lewis acid (electron-pair acceptor)."},{"id":98,"lecture":"Lecture 5 - Acids and Bases","topic":"Conjugate pair","difficulty":"understanding","question":"When a Brønsted–Lowry acid donates a proton, the species that remains is called its:","options":{"A":"Conjugate acid","B":"Conjugate base","C":"Lewis acid","D":"Salt"},"answer":"B","explanation":"After an acid donates a proton, the remaining species is its conjugate base; a base that accepts a proton becomes its conjugate acid."},{"id":99,"lecture":"Lecture 5 - Acids and Bases","topic":"Amphoteric water","difficulty":"understanding","question":"Water is considered amphoteric because it can:","options":{"A":"Only donate protons","B":"Only accept protons","C":"Act as both an acid and a base","D":"Neither donate nor accept protons"},"answer":"C","explanation":"Water is amphoteric: it can donate a proton (acting as an acid) or accept a proton (acting as a base)."},{"id":100,"lecture":"Lecture 5 - Acids and Bases","topic":"Ion product of water","difficulty":"recall","question":"At 25 °C, the ion-product constant of water (Kw = [H⁺][OH⁻]) equals:","options":{"A":"1 × 10⁻⁷","B":"1 × 10⁻¹⁴","C":"1 × 10¹⁴","D":"7"},"answer":"B","explanation":"Kw = [H⁺][OH⁻] = 1 × 10⁻¹⁴ at 25 °C. In pure water [H⁺] = [OH⁻] = 1 × 10⁻⁷ M."},{"id":101,"lecture":"Lecture 5 - Acids and Bases","topic":"pH definition","difficulty":"recall","question":"The pH of a solution is defined as:","options":{"A":"The concentration of OH⁻","B":"The negative logarithm of the hydrogen ion concentration, –log[H⁺]","C":"The mass of acid present","D":"The temperature of the solution"},"answer":"B","explanation":"pH = –log[H⁺]. It is a convenient measure of the acidity of a solution."},{"id":102,"lecture":"Lecture 5 - Acids and Bases","topic":"Neutral pH","difficulty":"recall","question":"At 25 °C, a neutral solution has a pH of:","options":{"A":"0","B":"7","C":"10","D":"14"},"answer":"B","explanation":"A neutral solution has equal [H⁺] and [OH⁻] (1 × 10⁻⁷ M each), giving a pH of 7 at 25 °C."},{"id":103,"lecture":"Lecture 5 - Acids and Bases","topic":"Acidic pH","difficulty":"understanding","question":"A solution with a pH of 3 is:","options":{"A":"Strongly basic","B":"Neutral","C":"Acidic","D":"Identical to pure water"},"answer":"C","explanation":"A pH below 7 is acidic. The lower the pH, the higher the [H⁺] and the more acidic the solution."},{"id":104,"lecture":"Lecture 5 - Acids and Bases","topic":"pH scale logarithmic","difficulty":"application","question":"A solution of pH 4 has how many times greater [H⁺] than a solution of pH 6?","options":{"A":"2 times","B":"20 times","C":"100 times","D":"The same"},"answer":"C","explanation":"The pH scale is logarithmic; each pH unit is a 10-fold change. A difference of 2 pH units means 10² = 100 times greater hydrogen ion concentration."},{"id":105,"lecture":"Lecture 5 - Acids and Bases","topic":"Neutralization","difficulty":"recall","question":"A neutralization reaction between an acid and a base typically produces:","options":{"A":"A salt and water","B":"A gas and a metal","C":"Two acids","D":"Only hydrogen gas"},"answer":"A","explanation":"Neutralization of an acid by a base produces a salt and water (e.g., HCl + NaOH → NaCl + H2O)."},{"id":106,"lecture":"Lecture 5 - Acids and Bases","topic":"Buffer definition","difficulty":"recall","question":"A buffer solution is one that:","options":{"A":"Has no effect on pH","B":"Resists changes in pH when small amounts of acid or base are added","C":"Always has a pH of 7","D":"Only works with strong acids"},"answer":"B","explanation":"A buffer resists changes in pH upon addition of small amounts of acid or base; it usually contains a weak acid and its conjugate base."},{"id":107,"lecture":"Lecture 5 - Acids and Bases","topic":"Buffer components","difficulty":"understanding","question":"A typical buffer system consists of:","options":{"A":"A strong acid and a strong base","B":"A weak acid and its conjugate base (or a weak base and its conjugate acid)","C":"Two strong acids","D":"Pure water only"},"answer":"B","explanation":"Buffers are made of a weak acid and its conjugate base (or a weak base and its conjugate acid), allowing them to neutralize added acid or base."},{"id":108,"lecture":"Lecture 5 - Acids and Bases","topic":"Bicarbonate buffer","difficulty":"recall","question":"The most important buffer system in human blood plasma is the:","options":{"A":"Phosphate buffer","B":"Bicarbonate (carbonic acid/bicarbonate) buffer","C":"Ammonia buffer","D":"Acetate buffer"},"answer":"B","explanation":"The bicarbonate buffer system (H2CO3 / HCO3⁻) is the principal buffer of blood plasma and helps maintain blood pH around 7.4."},{"id":109,"lecture":"Lecture 5 - Acids and Bases","topic":"Body buffers","difficulty":"recall","question":"Which of the following is one of the body\u0027s main buffer systems?","options":{"A":"Phosphate buffer","B":"Bicarbonate buffer","C":"Protein buffer","D":"All of the above"},"answer":"D","explanation":"The body\u0027s principal buffers are the bicarbonate, phosphate, and protein buffer systems, which together stabilize the pH of body fluids."},{"id":110,"lecture":"Lecture 5 - Acids and Bases","topic":"Blood pH","difficulty":"recall","question":"The normal pH of human arterial blood is approximately:","options":{"A":"5.4","B":"6.0","C":"7.4","D":"8.5"},"answer":"C","explanation":"Normal arterial blood pH is tightly regulated to about 7.35–7.45 (≈ 7.4); deviations cause acidosis or alkalosis."},{"id":111,"lecture":"Lecture 5 - Acids and Bases","topic":"Acidosis","difficulty":"understanding","question":"Acidosis is a condition in which the blood pH:","options":{"A":"Falls below the normal range (too acidic)","B":"Rises above the normal range (too basic)","C":"Stays exactly at 7.4","D":"Becomes zero"},"answer":"A","explanation":"Acidosis occurs when blood pH drops below the normal range (blood becomes too acidic); alkalosis is when pH rises above normal."},{"id":112,"lecture":"Lecture 5 - Acids and Bases","topic":"Alkalosis","difficulty":"understanding","question":"Alkalosis refers to a blood condition in which the pH is:","options":{"A":"Below normal (too acidic)","B":"Above normal (too basic)","C":"Exactly neutral","D":"Unmeasurable"},"answer":"B","explanation":"Alkalosis is an abnormal rise of blood pH above the normal range, making the blood too basic (alkaline)."},{"id":113,"lecture":"Lecture 5 - Acids and Bases","topic":"Strong vs weak acid","difficulty":"understanding","question":"A strong acid differs from a weak acid in that a strong acid:","options":{"A":"Ionizes completely in water","B":"Ionizes only slightly in water","C":"Does not contain hydrogen","D":"Always has a higher pH"},"answer":"A","explanation":"A strong acid dissociates (ionizes) essentially completely in water, whereas a weak acid only partially ionizes, establishing an equilibrium."},{"id":114,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Ionic compounds","difficulty":"recall","question":"Ionic compounds are held together by:","options":{"A":"Shared electron pairs","B":"Strong attractions between oppositely charged ions (ionic bonds)","C":"Hydrogen bonds only","D":"Metallic bonds"},"answer":"B","explanation":"Ionic compounds consist of positive and negative ions held together by ionic bonds – strong electrostatic attractions between oppositely charged ions."},{"id":115,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Covalent bond formation","difficulty":"understanding","question":"A covalent bond forms when:","options":{"A":"Electrons are transferred from metal to nonmetal","B":"Atoms of two nonmetals share electrons","C":"Ions attract each other","D":"Protons are exchanged"},"answer":"B","explanation":"Because nonmetals have high ionization energies, they share electrons rather than transfer them; shared electrons form a covalent bond and produce molecules."},{"id":116,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Bond polarity","difficulty":"understanding","question":"The polarity of a covalent bond depends on the:","options":{"A":"Mass difference between atoms","B":"Electronegativity difference between the bonded atoms","C":"Color of the atoms","D":"Number of neutrons"},"answer":"B","explanation":"A bond becomes more polar as the electronegativity difference between the bonded atoms increases; shared electrons are pulled toward the more electronegative atom."},{"id":117,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Dipole","difficulty":"recall","question":"A polar covalent bond that has a separation of charges is called a:","options":{"A":"Dipole","B":"Cation","C":"Ligand","D":"Isotope"},"answer":"A","explanation":"A polar covalent bond with partial positive and partial negative ends (a separation of charge) is called a dipole."},{"id":118,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Coordination compound examples","difficulty":"recall","question":"Chlorophyll, hemoglobin, and vitamin B12 are coordination compounds of which metals, respectively?","options":{"A":"Iron, magnesium, cobalt","B":"Magnesium, iron, cobalt","C":"Cobalt, magnesium, iron","D":"Calcium, iron, zinc"},"answer":"B","explanation":"Chlorophyll is a coordination compound of magnesium, hemoglobin of iron, and vitamin B12 of cobalt – vital biological coordination compounds."},{"id":119,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Werner\u0027s theory","difficulty":"recall","question":"Alfred Werner proposed that a metal ion has two types of valence:","options":{"A":"Strong and weak valence","B":"Primary valence and secondary valence","C":"Ionic and covalent valence","D":"Positive and negative valence"},"answer":"B","explanation":"Werner proposed the concept of primary valence (oxidation state) and secondary valence (coordination number) for metal ions, earning the 1913 Nobel Prize."},{"id":120,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Ligand","difficulty":"recall","question":"In a coordination compound, the ions or neutral molecules bound to the central atom are called:","options":{"A":"Ligands","B":"Isotopes","C":"Dipoles","D":"Buffers"},"answer":"A","explanation":"Ligands (also called complexing agents) are the ions or neutral molecules bound to the central metal atom via coordinate covalent bonds."},{"id":121,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Coordination centre","difficulty":"recall","question":"The central metal atom in a coordination complex is called the:","options":{"A":"Ligand","B":"Coordination centre","C":"Counter ion","D":"Donor atom"},"answer":"B","explanation":"The central atom (usually a transition metal) to which ligands are bound is called the coordination centre."},{"id":122,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Metal-ligand bond type","difficulty":"understanding","question":"The metal–ligand bond in a coordination complex is best described as a:","options":{"A":"Lewis acid–base interaction (metal = acid, ligand = base)","B":"Pure ionic bond between two cations","C":"Hydrogen bond","D":"Metallic bond"},"answer":"A","explanation":"Metal–ligand bonds are Lewis acid–base interactions: the metal acts as an electron-pair acceptor (Lewis acid) and the ligand as an electron-pair donor (Lewis base)."},{"id":123,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Transition metals - d subshell","difficulty":"understanding","question":"A defining feature of transition metals is that they:","options":{"A":"Have completely empty d subshells","B":"Have incompletely filled d subshells or form ions with incompletely filled d subshells","C":"Never form ions","D":"Have no electrons"},"answer":"B","explanation":"Transition metals typically have incompletely filled d subshells (or give ions with them), which underlies their color, magnetism, catalytic activity, and complex formation."},{"id":124,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Electron removal order","difficulty":"application","question":"When first-row transition metals form cations, electrons are removed first from which orbital?","options":{"A":"The 3d orbitals","B":"The 4s orbitals","C":"The 2p orbitals","D":"The 1s orbitals"},"answer":"B","explanation":"For first-row transition metals, electrons are removed first from the 4s orbitals and then from the 3d orbitals when forming cations."},{"id":125,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Transition metal reactivity","difficulty":"understanding","question":"Most transition metals are inert toward acids or react slowly because:","options":{"A":"They have no valence electrons","B":"They are protected by a layer of oxide","C":"They are nonmetals","D":"They have completely filled shells"},"answer":"B","explanation":"Although their reduction potentials suggest most should react with strong acids, a protective oxide layer makes most transition metals inert or slow to react."},{"id":126,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Optical isomers","difficulty":"recall","question":"Optical isomers (enantiomers) are:","options":{"A":"Identical molecules","B":"Mirror images that cannot be superimposed on one another","C":"Compounds with different formulas","D":"Different isotopes"},"answer":"B","explanation":"Optical isomers, or enantiomers, are non-superimposable mirror images of each other."},{"id":127,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Crystal field theory","difficulty":"understanding","question":"Crystal Field Theory (CFT) treats the metal–ligand bond as:","options":{"A":"Purely covalent","B":"Ionic, arising from electrostatic interactions, with ligands as point charges/dipoles","C":"A hydrogen bond","D":"A metallic bond"},"answer":"B","explanation":"CFT is an electrostatic model in which the metal–ligand bond is treated as ionic, with ligands modeled as point charges (anions) or point dipoles (neutral molecules)."},{"id":128,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"d-orbital splitting","difficulty":"understanding","question":"In an isolated gaseous metal ion, the five d orbitals are degenerate. In a complex this degeneracy is:","options":{"A":"Maintained for all complexes","B":"Lifted (the d orbitals split) due to the asymmetric ligand field","C":"Destroyed completely so no orbitals exist","D":"Converted into s orbitals"},"answer":"B","explanation":"When ligands approach, the field becomes asymmetric and the degeneracy of the d orbitals is lifted, causing the d orbitals to split in energy."},{"id":129,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Complementary color","difficulty":"application","question":"If a coordination complex absorbs green light, it will appear:","options":{"A":"Green","B":"Red (the complementary color)","C":"Black","D":"Colorless"},"answer":"B","explanation":"The observed color is complementary to the absorbed wavelength; if green is absorbed, the complex appears red."},{"id":130,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Weakness of CFT","difficulty":"understanding","question":"A recognized weakness of Crystal Field Theory is that it:","options":{"A":"Cannot explain any color","B":"Does not account for the covalent character of the metal–ligand bond","C":"Ignores the existence of d orbitals","D":"Works only for nonmetals"},"answer":"B","explanation":"CFT treats ligands as point charges and ignores the covalent character of metal–ligand bonding; this limitation is addressed by ligand field and molecular orbital theories."},{"id":131,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Magnetic susceptibility","difficulty":"recall","question":"The magnetic moment of a coordination compound can be measured by:","options":{"A":"pH measurement","B":"Magnetic susceptibility experiments","C":"Boiling point determination","D":"Titration"},"answer":"B","explanation":"Magnetic susceptibility experiments are used to measure the magnetic moment of coordination compounds, revealing the number of unpaired electrons."},{"id":132,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Metal carbonyls","difficulty":"application","question":"Tetracarbonylnickel(0), Ni(CO)4, has which geometry?","options":{"A":"Octahedral","B":"Tetrahedral","C":"Trigonal bipyramidal","D":"Square planar"},"answer":"B","explanation":"Ni(CO)4 is tetrahedral, Fe(CO)5 is trigonal bipyramidal, and Cr(CO)6 is octahedral – examples of homoleptic metal carbonyls."},{"id":133,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Chelating analytical reagents","difficulty":"recall","question":"Which reagent is commonly used in analytical chemistry as a chelating ligand for metal ions?","options":{"A":"EDTA","B":"NaCl","C":"Glucose","D":"Ethanol"},"answer":"A","explanation":"EDTA (along with DMG, α-nitroso-β-naphthol, cupron, etc.) is a chelating ligand widely used to detect and estimate metal ions in chemical analysis."},{"id":134,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Applications of coordination compounds","difficulty":"understanding","question":"Coordination compounds are important in all of the following EXCEPT:","options":{"A":"Biological systems (e.g., hemoglobin)","B":"Analytical chemistry and metallurgy","C":"Electroplating and dyeing","D":"Acting as a primary energy source like glucose"},"answer":"D","explanation":"Coordination compounds are vital in biological systems, analytical chemistry, metallurgy, catalysis, electroplating, dyeing, and medicine – but they are not a primary metabolic energy source."},{"id":135,"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Valence bond hybridization","difficulty":"understanding","question":"According to Valence Bond Theory, a metal ion uses hybridized orbitals to produce geometries such as:","options":{"A":"Only linear","B":"Octahedral, tetrahedral, and square planar","C":"Only spherical","D":"No defined geometry"},"answer":"B","explanation":"In Valence Bond Theory the metal ion hybridizes its (n-1)d, ns, np (or ns, np, nd) orbitals to give defined geometries such as octahedral, tetrahedral, and square planar."},{"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Activation energy (book)","difficulty":"recall","question":"Activation energy is best defined as the energy needed to:","options":{"A":"Form a solution","B":"Convert the reacting molecules into products (the energy barrier of a reaction)","C":"Lower the temperature of reactants","D":"Dissolve a solid in water"},"answer":"B","explanation":"Activation energy is the energy required to convert reacting molecules into products; it is the barrier that colliding particles must overcome.","source":"Timberlake textbook (13th Ed.)","id":136},{"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Endothermic energy diagram","difficulty":"understanding","question":"In an endothermic reaction, the energy of the products is:","options":{"A":"Lower than that of the reactants","B":"Higher than that of the reactants (heat is absorbed)","C":"Exactly equal to that of the reactants","D":"Always zero"},"answer":"B","explanation":"In an endothermic reaction heat is absorbed, so the products have higher energy than the reactants; heat is written on the reactant side of the equation.","source":"Timberlake textbook (13th Ed.)","id":137},{"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Exothermic energy diagram","difficulty":"understanding","question":"In an exothermic reaction, heat appears on which side of the equation and the products are at what energy?","options":{"A":"Reactant side; products higher energy","B":"Product side; products lower energy than reactants","C":"Neither side; energy is unchanged","D":"Product side; products higher energy"},"answer":"B","explanation":"An exothermic reaction releases heat, so heat is written on the product side and the products are at a lower energy level than the reactants.","source":"Timberlake textbook (13th Ed.)","id":138},{"lecture":"Lecture 2 - Chemical Reactions, Energy \u0026 Thermodynamics","topic":"Cold pack example","difficulty":"application","question":"An instant cold pack that uses ammonium nitrate dissolving in water gets cold because the process is:","options":{"A":"Exothermic (releases heat)","B":"Endothermic (absorbs heat)","C":"A combustion reaction","D":"A redox reaction"},"answer":"B","explanation":"Dissolving ammonium nitrate in water absorbs heat from the surroundings (endothermic), making the pack feel cold – useful for reducing swelling.","source":"Timberlake textbook (13th Ed.)","id":139},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"10-degree rule","difficulty":"application","question":"As a general rule, for every 10 °C increase in temperature, most reaction rates approximately:","options":{"A":"Stay the same","B":"Double","C":"Decrease by half","D":"Increase 100-fold"},"answer":"B","explanation":"A useful rule of thumb: for every 10 °C rise in temperature, most reaction rates roughly double, because molecules collide more often and more energetically.","source":"Timberlake textbook (13th Ed.)","id":140},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Refrigeration","difficulty":"application","question":"Why does refrigerating perishable food make it last longer?","options":{"A":"Cold adds a catalyst","B":"Lower temperature slows the rate of spoilage reactions","C":"Cold increases reactant concentration","D":"Cold raises the activation energy to zero"},"answer":"B","explanation":"Lowering the temperature decreases the kinetic energy and collision frequency of molecules, slowing the chemical reactions that spoil food.","source":"Timberlake textbook (13th Ed.)","id":141},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Le Chatelier - add reactant","difficulty":"application","question":"For the equilibrium HF + H2O ⇌ F⁻ + H3O⁺, adding more HF will shift the system toward:","options":{"A":"The reactants","B":"The products (forward reaction)","C":"No shift occurs","D":"Stopping the reaction"},"answer":"B","explanation":"Adding reactant is a stress relieved by shifting away from the added substance – toward the products, increasing the forward reaction rate.","source":"Timberlake textbook (13th Ed.)","id":142},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Le Chatelier - remove product","difficulty":"application","question":"When a product is removed from a system at equilibrium, the equilibrium shifts toward:","options":{"A":"The reactants","B":"The products (to replace what was removed)","C":"Neither direction","D":"Complete stop"},"answer":"B","explanation":"Removing a product causes the system to shift in the direction of that product (forward) to replace it and re-establish equilibrium.","source":"Timberlake textbook (13th Ed.)","id":143},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"Oxygen-hemoglobin equilibrium","difficulty":"application","question":"For Hb + O2 ⇌ HbO2, in the lungs where O2 is high, the equilibrium shifts to:","options":{"A":"Release oxygen from hemoglobin","B":"Form more oxyhemoglobin (HbO2)","C":"Break down hemoglobin","D":"Produce carbon dioxide"},"answer":"B","explanation":"High O2 in the alveoli shifts the equilibrium toward HbO2 (loading oxygen); in tissues where O2 is low, the reverse reaction releases oxygen.","source":"Timberlake textbook (13th Ed.)","id":144},{"lecture":"Lecture 3 - Reaction Rates, Kinetics \u0026 Equilibrium","topic":"High altitude hypoxia","difficulty":"application","question":"At high altitude, the lower atmospheric pressure reduces the partial pressure of oxygen, which:","options":{"A":"Increases oxygen loading onto hemoglobin","B":"Decreases the oxygen available to bind hemoglobin, causing hypoxia","C":"Has no effect on hemoglobin","D":"Converts hemoglobin to a catalyst"},"answer":"B","explanation":"Lower partial pressure of O2 at altitude means less oxygen is available to bind hemoglobin, shifting the equilibrium toward free Hb and causing hypoxia.","source":"Timberlake textbook (13th Ed.)","id":145},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Solute vs solvent example","difficulty":"application","question":"In a solution made of 20.0 g of KCl dissolved in 200.0 g of water, the solute and solvent are:","options":{"A":"KCl is the solvent; water is the solute","B":"KCl is the solute; water is the solvent","C":"Both are solvents","D":"Both are solutes"},"answer":"B","explanation":"The substance present in the smaller amount and being dissolved (KCl) is the solute; water, the dissolving medium present in larger amount, is the solvent.","source":"Timberlake textbook (13th Ed.)","id":146},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Hydration","difficulty":"understanding","question":"When NaCl dissolves in water, the process in which water molecules surround and stabilize the separated ions is called:","options":{"A":"Combustion","B":"Hydration","C":"Oxidation","D":"Saponification"},"answer":"B","explanation":"Hydration is the surrounding of dissolved ions by water molecules; it diminishes the ions\u0027 attraction to each other and keeps them in solution.","source":"Timberlake textbook (13th Ed.)","id":147},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Electrolyte","difficulty":"recall","question":"A substance that dissociates into ions in water and allows the solution to conduct electricity is a(n):","options":{"A":"Nonelectrolyte","B":"Electrolyte","C":"Catalyst","D":"Buffer"},"answer":"B","explanation":"Electrolytes dissociate into ions in water, producing solutions that conduct electricity; nonelectrolytes dissolve as molecules and do not conduct.","source":"Timberlake textbook (13th Ed.)","id":148},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Strong vs weak electrolyte","difficulty":"understanding","question":"A strong electrolyte such as NaCl differs from a weak electrolyte because in water it:","options":{"A":"Dissolves as molecules only","B":"Dissociates essentially 100% into ions","C":"Does not dissolve at all","D":"Forms a gas"},"answer":"B","explanation":"A strong electrolyte (e.g., NaCl) undergoes ~100% dissociation into ions, while a weak electrolyte dissolves mostly as molecules with only a few ions.","source":"Timberlake textbook (13th Ed.)","id":149},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Nonelectrolyte example","difficulty":"application","question":"Which of the following dissolves in water as molecules and does NOT conduct electricity?","options":{"A":"Sodium chloride (NaCl)","B":"Sucrose (table sugar, C12H22O11)","C":"Magnesium nitrate","D":"Potassium chloride (KCl)"},"answer":"B","explanation":"Sucrose is a nonelectrolyte – it dissolves as neutral molecules without forming ions, so its solution does not conduct electricity.","source":"Timberlake textbook (13th Ed.)","id":150},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Definition of solubility","difficulty":"recall","question":"Solubility is usually expressed as the maximum amount of solute that dissolves in:","options":{"A":"1 liter of air","B":"100 g of solvent at a given temperature","C":"1 mole of product","D":"any volume regardless of temperature"},"answer":"B","explanation":"Solubility is typically given as grams of solute per 100 g of solvent at a specified temperature – the maximum that can dissolve under those conditions.","source":"Timberlake textbook (13th Ed.)","id":151},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Saturated solution","difficulty":"understanding","question":"A solution that contains the maximum amount of dissolved solute, with excess solid remaining, is described as:","options":{"A":"Unsaturated","B":"Saturated","C":"Dilute","D":"Nonpolar"},"answer":"B","explanation":"A saturated solution holds the maximum dissolvable solute at that temperature; any additional solute remains undissolved at the bottom.","source":"Timberlake textbook (13th Ed.)","id":152},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Body water percentage","difficulty":"recall","question":"Approximately what percentage of the average adult body is water by mass?","options":{"A":"About 20%","B":"About 40%","C":"About 60%","D":"About 90%"},"answer":"C","explanation":"The average adult body is about 60% water by mass (an infant about 75%); roughly 60% of that water is intracellular and 40% extracellular.","source":"Timberlake textbook (13th Ed.)","id":153},{"lecture":"Lecture 4 - Physical Properties of Solutions","topic":"Dehydration","difficulty":"application","question":"Serious dehydration can occur in an adult with a net loss of total body fluid of about:","options":{"A":"1%","B":"10%","C":"50%","D":"75%"},"answer":"B","explanation":"A 10% net loss of total body fluid causes serious dehydration in an adult, and a 20% loss can be fatal.","source":"Timberlake textbook (13th Ed.)","id":154},{"lecture":"Lecture 5 - Acids and Bases","topic":"Hydronium ion","difficulty":"understanding","question":"When an acid donates H⁺ in water, the H⁺ bonds to a water molecule to form the:","options":{"A":"Hydroxide ion (OH⁻)","B":"Hydronium ion (H3O⁺)","C":"Oxide ion (O²⁻)","D":"Peroxide ion"},"answer":"B","explanation":"A free H⁺ does not exist in water; it attaches to a water molecule to form the hydronium ion, H3O⁺.","source":"Timberlake textbook (13th Ed.)","id":155},{"lecture":"Lecture 5 - Acids and Bases","topic":"Conjugate base","difficulty":"application","question":"In the reaction HF + H2O ⇌ F⁻ + H3O⁺, the conjugate base of HF is:","options":{"A":"H2O","B":"F⁻","C":"H3O⁺","D":"OH⁻"},"answer":"B","explanation":"HF donates a proton to become F⁻, so F⁻ is the conjugate base of the acid HF. (H2O is the base, H3O⁺ its conjugate acid.)","source":"Timberlake textbook (13th Ed.)","id":156},{"lecture":"Lecture 5 - Acids and Bases","topic":"Conjugate acid of water","difficulty":"application","question":"When water acts as a base and accepts a proton, it becomes its conjugate acid, which is:","options":{"A":"OH⁻","B":"H3O⁺","C":"O²⁻","D":"H2"},"answer":"B","explanation":"Water accepting a proton forms the hydronium ion H3O⁺, which is the conjugate acid of water.","source":"Timberlake textbook (13th Ed.)","id":157},{"lecture":"Lecture 5 - Acids and Bases","topic":"Strong acid example","difficulty":"recall","question":"Which of the following is a STRONG acid that dissociates essentially completely in water?","options":{"A":"Acetic acid (HC2H3O2)","B":"Carbonic acid (H2CO3)","C":"Hydrochloric acid (HCl)","D":"Hydrofluoric acid (HF)"},"answer":"C","explanation":"HCl is a strong acid that dissociates ~100% in water. Acetic, carbonic, and hydrofluoric acids are weak acids that only partially ionize.","source":"Timberlake textbook (13th Ed.)","id":158},{"lecture":"Lecture 5 - Acids and Bases","topic":"Strong acid - weak conjugate base","difficulty":"understanding","question":"A strong acid is characterized by having a:","options":{"A":"Strong conjugate base","B":"Weak conjugate base","C":"No conjugate base","D":"Conjugate acid only"},"answer":"B","explanation":"Strong acids dissociate completely and have weak conjugate bases; weak acids have relatively strong conjugate bases, favoring the reverse reaction.","source":"Timberlake textbook (13th Ed.)","id":159},{"lecture":"Lecture 5 - Acids and Bases","topic":"Kw calculation","difficulty":"application","question":"If the [H3O⁺] of a solution at 25 °C is 1.0 × 10⁻³ M, what is the [OH⁻]? (Kw = 1.0 × 10⁻¹⁴)","options":{"A":"1.0 × 10⁻³ M","B":"1.0 × 10⁻¹¹ M","C":"1.0 × 10⁻⁷ M","D":"1.0 × 10⁻¹⁴ M"},"answer":"B","explanation":"[OH⁻] = Kw / [H3O⁺] = (1.0 × 10⁻¹⁴) / (1.0 × 10⁻³) = 1.0 × 10⁻¹¹ M.","source":"Timberlake textbook (13th Ed.)","id":160},{"lecture":"Lecture 5 - Acids and Bases","topic":"Acidic by ion concentration","difficulty":"understanding","question":"A solution is acidic when:","options":{"A":"[H3O⁺] equals [OH⁻]","B":"[H3O⁺] is greater than [OH⁻]","C":"[H3O⁺] is less than [OH⁻]","D":"there are no ions present"},"answer":"B","explanation":"In an acidic solution [H3O⁺] \u003e [OH⁻]; in a basic solution [OH⁻] \u003e [H3O⁺]; in a neutral solution they are equal.","source":"Timberlake textbook (13th Ed.)","id":161},{"lecture":"Lecture 5 - Acids and Bases","topic":"pH calculation","difficulty":"application","question":"A solution with [H3O⁺] = 1.0 × 10⁻² M has a pH of:","options":{"A":"2.00","B":"7.00","C":"12.00","D":"0.02"},"answer":"A","explanation":"pH = –log[H3O⁺] = –log(1.0 × 10⁻²) = 2.00. A pH of 2 indicates an acidic solution.","source":"Timberlake textbook (13th Ed.)","id":162},{"lecture":"Lecture 5 - Acids and Bases","topic":"Buffer composition (book)","difficulty":"understanding","question":"Most buffer solutions are made of nearly equal concentrations of a:","options":{"A":"Strong acid and a strong base","B":"Weak acid and a salt containing its conjugate base","C":"Nonelectrolyte and water","D":"Strong acid and its salt"},"answer":"B","explanation":"A buffer typically consists of a weak acid plus a salt of its conjugate base (or a weak base plus its conjugate acid), enabling it to neutralize added acid or base.","source":"Timberlake textbook (13th Ed.)","id":163},{"lecture":"Lecture 5 - Acids and Bases","topic":"Identify a buffer","difficulty":"application","question":"Which combination would act as a buffer solution?","options":{"A":"HCl (strong acid) and NaCl","B":"H3PO4 (weak acid) alone","C":"HF (weak acid) and NaF (its conjugate base salt)","D":"NaOH and NaCl"},"answer":"C","explanation":"A buffer needs a weak acid together with a salt of its conjugate base. HF with NaF satisfies this; HCl is a strong acid, and H3PO4 alone lacks its conjugate base salt.","source":"Timberlake textbook (13th Ed.)","id":164},{"lecture":"Lecture 5 - Acids and Bases","topic":"Blood plasma pH range","difficulty":"recall","question":"The normal pH range of arterial blood plasma is approximately:","options":{"A":"5.0 to 6.0","B":"6.8 to 8.0","C":"7.35 to 7.45","D":"8.5 to 9.0"},"answer":"C","explanation":"Normal arterial blood plasma pH is tightly maintained between about 7.35 and 7.45; values below 6.8 or above 8.0 can be fatal.","source":"Timberlake textbook (13th Ed.)","id":165},{"lecture":"Lecture 5 - Acids and Bases","topic":"How a buffer resists pH change","difficulty":"application","question":"In an acetic acid/acetate buffer, when a small amount of strong base (OH⁻) is added, it is neutralized by the:","options":{"A":"Acetate ion (conjugate base)","B":"Acetic acid (weak acid)","C":"Water","D":"Sodium ion"},"answer":"B","explanation":"Added OH⁻ is neutralized by the weak acid (acetic acid), shifting equilibrium toward products; added H3O⁺ would be neutralized by the acetate ion.","source":"Timberlake textbook (13th Ed.)","id":166},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Electronegativity definition","difficulty":"recall","question":"Electronegativity is defined as an atom\u0027s ability to:","options":{"A":"Lose protons","B":"Attract the shared electrons in a chemical bond","C":"Gain neutrons","D":"Emit radiation"},"answer":"B","explanation":"Electronegativity measures an atom\u0027s ability to attract the shared (bonding) electrons; nonmetals have higher electronegativities than metals.","source":"Timberlake textbook (13th Ed.)","id":167},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Highest electronegativity","difficulty":"recall","question":"Which element is assigned the highest electronegativity value (4.0) on the scale?","options":{"A":"Cesium","B":"Fluorine","C":"Oxygen","D":"Sodium"},"answer":"B","explanation":"Fluorine, in the upper right of the periodic table, has the highest electronegativity (4.0); cesium has the lowest (0.7).","source":"Timberlake textbook (13th Ed.)","id":168},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Electronegativity difference - bond type","difficulty":"application","question":"An electronegativity difference greater than about 1.8 between two atoms generally produces a(n):","options":{"A":"Nonpolar covalent bond","B":"Polar covalent bond","C":"Ionic bond","D":"Metallic bond"},"answer":"C","explanation":"Roughly: 0.0–0.4 = nonpolar covalent, 0.5–1.8 = polar covalent, and greater than 1.8 = ionic (electrons are transferred rather than shared).","source":"Timberlake textbook (13th Ed.)","id":169},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Nonpolar covalent bond","difficulty":"understanding","question":"The bond in an H2 molecule is nonpolar covalent because the electrons are:","options":{"A":"Transferred from one atom to the other","B":"Shared equally between identical atoms","C":"Not shared at all","D":"Donated by a ligand"},"answer":"B","explanation":"In H2 the two identical atoms have the same electronegativity, so bonding electrons are shared equally, giving a nonpolar covalent bond.","source":"Timberlake textbook (13th Ed.)","id":170},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Polar covalent bond (HCl)","difficulty":"application","question":"In an HCl molecule, the chlorine atom carries a partial negative charge because it:","options":{"A":"Has a lower electronegativity than hydrogen","B":"Is more electronegative and attracts the shared electrons more strongly","C":"Loses electrons to hydrogen","D":"Has no electrons"},"answer":"B","explanation":"Chlorine is more electronegative than hydrogen, so it pulls the shared electrons closer, becoming partially negative (δ−) while hydrogen becomes partially positive (δ+).","source":"Timberlake textbook (13th Ed.)","id":171},{"lecture":"Lecture 6 - Compounds \u0026 Coordination Chemistry","topic":"Dipole notation","difficulty":"recall","question":"The partial positive and partial negative ends of a polar bond (a dipole) are indicated by the symbols:","options":{"A":"+ and − (full charges)","B":"δ+ and δ− (lowercase delta)","C":"↑ and ↓","D":"α and β"},"answer":"B","explanation":"A dipole\u0027s partial charges are shown with the lowercase Greek letter delta: δ+ for the partially positive end and δ− for the partially negative end.","source":"Timberlake textbook (13th Ed.)","id":172}];

function applyTheme(theme) {
  if (theme === 'auto') {
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', sysDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  /* SVG icons driven by CSS [data-theme] — no JS needed to swap them */
}
function toggleTheme() {
  let t = localStorage.getItem(LS.THEME) || 'auto';
  // cycle: auto -> light -> dark -> auto
  if (t === 'auto') t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  else if (t === 'light') t = 'dark';
  else t = 'light';
  localStorage.setItem(LS.THEME, t);
  applyTheme(t);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escHtml(s) {

function fmtDate(iso) {

  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
    + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

/* Compute exam distribution */
function distribute(total) {
  const dist = {};
  let remaining = total;
  const subjs = Object.keys(SUBJ_RATIO);
  // First pass: floor
  subjs.forEach(s => {
    dist[s] = Math.floor(total * SUBJ_RATIO[s] / RATIO_TOTAL);
    remaining -= dist[s];
  });
  // Distribute remaining via highest-ratio first
  const order = subjs.slice().sort((a,b) => SUBJ_RATIO[b] - SUBJ_RATIO[a]);
  let i = 0;
  while (remaining > 0) {
    dist[order[i % order.length]] += 1;
    remaining--;
    i++;
  }
  return dist;
}

/* Build a quiz from a distribution */
function buildQuizQuestions(distMap) {
  const picks = [];
  Object.keys(distMap).forEach(subject => {
    const wanted = distMap[subject];
    const pool = QUESTIONS
      .map((q, i) => ({ q, i }))
      .filter(x => x.q.subject === subject);
    const shuffled = shuffle(pool);
    picks.push(...shuffled.slice(0, Math.min(wanted, shuffled.length)).map(x => x.i));
  });
  return shuffle(picks);
}

  state.qIds = [];
  QUESTIONS.forEach((q, i) => {
    const tk = `${q.subject}::${q.topic}`;
    if (!state.selectedTopics.has(tk)) return;
    if (state.search) {
      const txt = (q.q + ' ' + q.options.join(' ')).toLowerCase();
      if (!txt.includes(state.search)) return;

  state.answers = state.qIds.map(idx => ({ qIdx: idx, selected: null }));

  const q = QUESTIONS[qIdx];
  const ans = state.answers[state.index];
  const showFeedback = state.quizMode !== 'exam' && ans && ans.selected !== null;
  const isExam = state.quizMode === 'exam';
  const isLocked = (isExam && ans && ans.selected !== null) || showFeedback;

  let correct = 0, wrong = 0, answered = 0;
  state.answers.forEach((a, idx) => {
    if (a.selected !== null) {
      answered++;
      const q2 = QUESTIONS[state.qIds[idx]];
      if (a.selected === q2.answer) correct++; else wrong++;
    }
  });
  const accuracy = answered > 0 ? Math.round(100*correct/answered) : null;

  const letters = ['A','B','C','D','E','F'];
  if (!state.optionOrders) state.optionOrders = {};
  if (!state.optionOrders[qIdx]) {
    const ix = q.options.map((_, i) => i);
    for (let i = ix.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ix[i], ix[j]] = [ix[j], ix[i]]; }
    state.optionOrders[qIdx] = ix;
  }
  const displayOrder = state.optionOrders[qIdx];
  let optsHtml = '';
  displayOrder.forEach((origIdx, displayPos) => {
    const opt = q.options[origIdx];
    let cls = 'option';
    if (isExam) {
      if (ans && ans.selected !== null) {
        cls += ' disabled';
        if (origIdx === ans.selected) cls += ' selected';
      }
    } else {
      if (showFeedback) {
        cls += ' disabled';
        if (origIdx === q.answer) cls += ' correct';
        else if (origIdx === ans.selected) cls += ' incorrect';
      }
    }
    optsHtml += `<div class="${cls}" data-i="${origIdx}"><div class="letter">${letters[displayPos]}</div><div>${escHtml(opt)}</div></div>`;
  });

  let explHtml = '';
  if (showFeedback) {
    const isCorrect = ans.selected === q.answer;
    const correctDisplayPos = displayOrder.indexOf(q.answer);
    explHtml = `<div class="explanation ${isCorrect ? 'good' : 'bad'}">
      <strong>${isCorrect ? '✓ Correct' : '✗ Incorrect — Correct answer: ' + letters[correctDisplayPos]}.</strong>
      ${q.explanation ? ' ' + escHtml(q.explanation) : ''}
    </div>`;
  }

  // Stats only for non-exam modes
  let progressBar = '';
  if (!isExam || state.quizMode === 'exam') {
    progressBar = `
      <div class="quiz-progress-bar">
        <div class="qpb-stat"><span class="qpb-label">Question</span><span class="qpb-value">${state.index+1} / ${state.qIds.length}</span></div>
        ${!isExam ? `
          <div class="qpb-stat"><span class="qpb-label">Correct</span><span class="qpb-value good">${correct}</span></div>
          <div class="qpb-stat"><span class="qpb-label">Wrong</span><span class="qpb-value bad">${wrong}</span></div>
          <div class="qpb-stat"><span class="qpb-label">Accuracy</span><span class="qpb-value">${accuracy !== null ? accuracy + '%' : '—'}</span></div>
        ` : `
          <div class="qpb-stat"><span class="qpb-label">Answered</span><span class="qpb-value">${answered} / ${state.qIds.length}</span></div>
        `}
        <div class="qpb-fill"><div style="width: ${100*(state.index+1)/state.qIds.length}%"></div></div>
      </div>
    `;
  }

  const navHtml = `
    <div class="actions">
      <button class="btn" id="prevBtn" ${state.index === 0 ? 'disabled' : ''}>← Previous</button>
      <div style="display:flex;gap:8px;">
        ${state.quizMode === 'exam' && state.index === state.qIds.length - 1
          ? `<button class="btn primary" id="finishExamBtn">Submit Exam</button>`
          : (state.quizMode === 'practice' || state.quizMode === 'review-wrong') && state.index === state.qIds.length - 1
            ? `<button class="btn primary" id="finishPracticeBtn">Finish & See Results</button>`
            : `<button class="btn primary" id="nextBtn" ${state.index === state.qIds.length - 1 ? 'disabled' : ''}>Next →</button>`
        }
      </div>
    </div>
  `;

  container.innerHTML = `
    ${progressBar}
    <div class="question-card">
      <div class="q-meta">
        <span>${escHtml(q.subject)} · ${escHtml(q.topic)}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="q-tag">Q${state.index+1}</span>
          <button class="report-btn" id="reportBtn" title="Report a problem">🚩 Report</button>
        </div>
      </div>
      <div class="q-text">${escHtml(q.q)}</div>
      <div class="options">${optsHtml}</div>
      ${explHtml}
      ${navHtml}
    </div>
  `;

  container.querySelectorAll('.option').forEach(el => {
    el.onclick = () => {
      if (el.classList.contains('disabled')) return;
      const sel = parseInt(el.dataset.i);
      state.answers[state.index] = { qIdx, selected: sel };
      maybeShowMeme(sel === q.answer);
      renderQuizQuestion(container);
    };
  });
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.onclick = () => { dismissMeme(); state.index--; renderQuizQuestion(container); };
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = () => { dismissMeme(); state.index++; renderQuizQuestion(container); };
  const finishBtn = document.getElementById('finishExamBtn');
  if (finishBtn) finishBtn.onclick = () => promptSubmitExam();
  const finishPracticeBtn = document.getElementById('finishPracticeBtn');
  if (finishPracticeBtn) finishPracticeBtn.onclick = () => { dismissMeme(); finishExam(); };

  const opts = container.querySelectorAll('.option');
  let maxH = 0;
  opts.forEach(o => maxH = Math.max(maxH, o.offsetHeight));
  opts.forEach(o => o.style.minHeight = maxH + 'px');

  const reportBtn = document.getElementById('reportBtn');
  if (reportBtn) reportBtn.onclick = () => showReportModal(qIdx);
}

function confirmExitQuiz() {
  if (state.quizMode === 'exam') {
    if (!confirm('Leave the exam? Your progress will be lost.')) return;
  } else if (state.quizMode === 'practice' || state.quizMode === 'review-wrong') {
    const answered = state.answers.filter(a => a.selected !== null).length;
    if (answered > 0) {
      if (!confirm('Leave this session? Your progress will not be saved.')) return;
    }
  }
  goHome();
}

/* ====== SUBMIT EXAM ====== */
function promptSubmitExam() {
  const answered = state.answers.filter(a => a.selected !== null).length;
  const blank = state.qIds.length - answered;
  if (!confirm(`Submit exam now?\n\nAnswered: ${answered}\nBlank: ${blank}\n\nBlank questions will be marked wrong.`)) return;
  finishExam();
}
function finishExam() {
  // Compute results
  let correct = 0, wrong = 0;
  const subjectStats = {}; // {Subject: {correct, total}}
  const topicStats = {};   // {Subject::Topic: {correct, total, subject, topic}}
  state.answers.forEach(a => {
    const q = QUESTIONS[a.qIdx];
    const isC = a.selected !== null && a.selected === q.answer;
    if (isC) correct++; else wrong++;
    if (!subjectStats[q.subject]) subjectStats[q.subject] = { correct: 0, total: 0 };
    subjectStats[q.subject].total++;
    if (isC) subjectStats[q.subject].correct++;
    const tk = q.subject + '::' + q.topic;
    if (!topicStats[tk]) topicStats[tk] = { subject: q.subject, topic: q.topic, correct: 0, total: 0 };
    topicStats[tk].total++;
    if (isC) topicStats[tk].correct++;
  });
  const total = state.qIds.length;
  const score = total > 0 ? Math.round(100*correct/total) : 0;
  const record = {
    id: uid(),
    date: new Date().toISOString(),
    type: state.quizMode === 'review-wrong' ? 'practice' : state.quizMode,
    questionCount: total,
    correct, wrong, score,
    qIds: state.qIds,
    answers: state.answers.map(a => a.selected),
    subjectStats, topicStats,
  };
  if (state.user && state.user.registered) {
    const hist = getHistory();
    hist.unshift(record);
    setHistory(hist.slice(0, 200)); // keep last 200
  }
  // Track wrong answers
  if (state.user && state.user.registered) {
    const wrongMap = getWrong();
    state.answers.forEach(a => {
      if (a.selected === null || a.selected !== QUESTIONS[a.qIdx].answer) {
        wrongMap[a.qIdx] = wrongMap[a.qIdx] || [];
        wrongMap[a.qIdx].push({ date: record.date, examId: record.id, selected: a.selected });
      } else {
        // Got it right; if previously wrong, remove from wrong list
        if (wrongMap[a.qIdx]) delete wrongMap[a.qIdx];
      }
    });
    setWrong(wrongMap);
  }
  state.viewingExam = record;
  state.view = 'exam-results';
  render();
}

function renderBreakdown(stats, subjectMode) {
  const rows = Object.entries(stats).map(([key, s]) => {
    const pct = s.total > 0 ? Math.round(100*s.correct/s.total) : 0;
    const cls = pct >= 75 ? '' : (pct >= 50 ? 'warn' : 'bad');
    return `<div class="bd-row ${cls}">
      <span class="bd-label">${escHtml(key)} <small style="color:var(--text-muted)">(${s.correct}/${s.total})</small></span>
      <div class="bd-meter"><div style="width:${pct}%"></div></div>
      <span class="bd-pct">${pct}%</span>
    </div>`;
  });
  return rows.join('');
}
function renderTopicBreakdown(topicStats) {
  // Group by subject
  const bySubject = {};
  Object.values(topicStats).forEach(t => {
    if (!bySubject[t.subject]) bySubject[t.subject] = [];
    bySubject[t.subject].push(t);
  });
  let html = '';
  Object.entries(bySubject).forEach(([subject, topics]) => {
    topics.sort((a,b) => (a.correct/a.total||0) - (b.correct/b.total||0));
    html += `<div class="bd-row" style="font-weight:700;background:var(--bg-soft);"><span class="bd-label">${escHtml(subject)}</span><span></span><span></span></div>`;
    topics.forEach(t => {
      const pct = t.total > 0 ? Math.round(100*t.correct/t.total) : 0;
      const cls = pct >= 75 ? '' : (pct >= 50 ? 'warn' : 'bad');
      html += `<div class="bd-row ${cls}">
        <span class="bd-label" style="padding-left:14px;">↳ ${escHtml(t.topic)} <small style="color:var(--text-muted)">(${t.correct}/${t.total})</small></span>
        <div class="bd-meter"><div style="width:${pct}%"></div></div>
        <span class="bd-pct">${pct}%</span>
      </div>`;
    });
  });
  return html;
}

function renderReviewQuestion(container) {
  if (state.qIds.length === 0) return;
  const qIdx = state.qIds[state.index];

  let optsHtml = '';
  q.options.forEach((opt, i) => {
    let cls = 'option disabled';
    if (i === q.answer) cls += ' correct';
    else if (ans && ans.selected !== null && i === ans.selected) cls += ' incorrect';
    optsHtml += `<div class="${cls}"><div class="letter">${letters[i]}</div><div>${escHtml(opt)}</div></div>`;
  });
  const isCorrect = ans && ans.selected === q.answer;
  const wasAnswered = ans && ans.selected !== null;
  const explHtml = `<div class="explanation ${isCorrect ? 'good' : 'bad'}">
    <strong>${isCorrect ? '✓ Correct' : (wasAnswered ? '✗ Incorrect — Correct answer: ' + letters[q.answer] : 'Unanswered — Correct answer: ' + letters[q.answer])}.</strong>
    ${q.explanation ? ' ' + escHtml(q.explanation) : ''}

  container.innerHTML = `

          <span class="q-tag">Q${state.index+1}</span>
          <button class="report-btn" id="reportBtnR" title="Report a problem">🚩 Report</button>
        </div>
      </div>
      <div class="q-text">${escHtml(q.q)}</div>
      <div class="options">${optsHtml}</div>

      <div class="actions">
        <button class="btn" id="prevR" ${state.index === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="btn primary" id="nextR" ${state.index === state.qIds.length - 1 ? 'disabled' : ''}>Next →</button>
      </div>
    </div>
  `;
  const pr = document.getElementById('prevR');
  if (pr) pr.onclick = () => { state.index--; renderReviewQuestion(container); };
  const nr = document.getElementById('nextR');

  opts2.forEach(o => o.style.minHeight = maxH2 + 'px');

  const reportBtnR = document.getElementById('reportBtnR');
  if (reportBtnR) reportBtnR.onclick = () => showReportModal(qIdx);
}

    '.mode-card.flashcards .mode-icon{background:linear-gradient(135deg,#8B5CF6,#EC4899);}'
  ].join('');
  document.head.appendChild(st);
}
function initFlashcards() {
  if (typeof QUESTIONS === 'undefined' || !QUESTIONS.length || typeof SUBJECTS === 'undefined') { goHome(); return; }
  if (!fc.topics || !fc.topics.size) { fc.topics = new Set(); for (var s in SUBJECTS) { for (var t in SUBJECTS[s]) { fc.topics.add(s + '::' + t); } } }
  state.view = 'flashcards-config'; render();
}
function fcSelectedIndices() {
  var out = [];
  for (var s in SUBJECTS) { for (var t in SUBJECTS[s]) { if (fc.topics.has(s + '::' + t)) { out = out.concat(SUBJECTS[s][t]); } } }
  return out;
}
function fcUpdateCount() {
  var idx = fcSelectedIndices(); var sched = fcLoad(); var now = Date.now(); var due = 0;
  for (var i = 0; i < idx.length; i++) { var c = sched[idx[i]]; if (c && (c.due || 0) <= now) due++; }
  var el = document.getElementById('fcCount');
  if (el) el.innerHTML = '<strong>' + idx.length + '</strong> card' + (idx.length !== 1 ? 's' : '') + ' selected &middot; <strong>' + due + '</strong> due today';
  var sb = document.getElementById('fcStart'); if (sb) sb.disabled = (idx.length === 0);
}
function fcSyncSubjBoxes() {
  var boxes = document.querySelectorAll('.fc-subjbox');
  for (var i = 0; i < boxes.length; i++) {
    var s = decodeURIComponent(boxes[i].getAttribute('data-subj')); var total = 0, on = 0;
    for (var t in SUBJECTS[s]) { total++; if (fc.topics.has(s + '::' + t)) on++; }
    boxes[i].checked = (total > 0 && on === total); boxes[i].indeterminate = (on > 0 && on < total);
  }
}
function renderFlashcardsConfig(root) {
  if (!root) root = document.getElementById('root');
  if (typeof SUBJECTS === 'undefined') { goHome(); return; }
  var h = '<div class="container"><div class="page-header"><button class="back-btn" aria-label="Go back" onclick="goHome()">&#8592;</button><h1>Flashcards</h1></div>';
  h += '<div class="card" style="padding:20px;">';
  h += '<div id="fcCount" class="fc-count">&nbsp;</div>';
  h += '<div class="fc-actions"><button class="btn" id="fcAll">Select all</button><button class="btn" id="fcNone">Clear</button></div>';
  h += '<div class="fc-topics">';
  for (var s in SUBJECTS) {
    h += '<div class="fc-subj"><div class="fc-subj-head"><label><input type="checkbox" class="fc-subjbox" data-subj="' + encodeURIComponent(s) + '"> ' + escHtml(s) + '</label></div>';
    for (var t in SUBJECTS[s]) {
      var key = s + '::' + t; var ck = fc.topics.has(key) ? ' checked' : '';
      h += '<label class="fc-topic"><input type="checkbox" class="fc-topicbox" data-key="' + encodeURIComponent(key) + '"' + ck + '><span>' + escHtml(t) + '</span><span class="fc-n">' + SUBJECTS[s][t].length + '</span></label>';
    }
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="btn primary lg" id="fcStart" style="width:100%;margin-top:16px;">Start studying &#8594;</button>';
  h += '</div></div>';
  root.innerHTML = h;
  var tb = root.querySelectorAll('.fc-topicbox');
  for (var i = 0; i < tb.length; i++) { tb[i].onchange = (function (cb) { return function () { var k = decodeURIComponent(cb.getAttribute('data-key')); if (cb.checked) fc.topics.add(k); else fc.topics.delete(k); fcUpdateCount(); fcSyncSubjBoxes(); }; })(tb[i]); }
  var xb = root.querySelectorAll('.fc-subjbox');
  for (var j = 0; j < xb.length; j++) { xb[j].onchange = (function (cb) { return function () { var s = decodeURIComponent(cb.getAttribute('data-subj')); for (var t in SUBJECTS[s]) { var k = s + '::' + t; if (cb.checked) fc.topics.add(k); else fc.topics.delete(k); } renderFlashcardsConfig(root); }; })(xb[j]); }
  var ab = document.getElementById('fcAll'); if (ab) ab.onclick = function () { for (var s in SUBJECTS) { for (var t in SUBJECTS[s]) { fc.topics.add(s + '::' + t); } } renderFlashcardsConfig(root); };
  var nb = document.getElementById('fcNone'); if (nb) nb.onclick = function () { fc.topics.clear(); renderFlashcardsConfig(root); };
  var stb = document.getElementById('fcStart'); if (stb) stb.onclick = function () { fcStart(); };
  fcUpdateCount(); fcSyncSubjBoxes();
}
function fcStart() {
  var idx = fcSelectedIndices(); if (!idx.length) return;
  var sched = fcLoad(); var now = Date.now(); var due = [], fresh = [];
  for (var i = 0; i < idx.length; i++) { var c = sched[idx[i]]; if (!c) fresh.push(idx[i]); else if ((c.due || 0) <= now) due.push(idx[i]); }
  fcShuffle(due); fcShuffle(fresh);
  fc.queue = due.concat(fresh.slice(0, 20)); fc.cram = false;
  if (fc.queue.length === 0) { fc.queue = fcShuffle(idx.slice()).slice(0, 30); fc.cram = true; }
  fc.i = 0; fc.flipped = false; fc.again = 0; fc.good = 0; fc.total = fc.queue.length;
  state.view = 'flashcards'; render();
}
function fcToConfig() { state.view = 'flashcards-config'; render(); }
function fcGrade(idx, rating) {
  var sched = fcLoad(); var c = sched[idx] || { ease: 2.3, interval: 0, reps: 0 };
  if (rating === 'again') { c.ease = Math.max(1.3, (c.ease || 2.3) - 0.2); c.interval = 0; c.reps = 0; }
  else if (rating === 'good') { c.reps = (c.reps || 0) + 1; c.interval = c.interval ? Math.round(c.interval * c.ease) : 1; }
  else { c.ease = Math.min(2.8, (c.ease || 2.3) + 0.15); c.reps = (c.reps || 0) + 1; c.interval = c.interval ? Math.round(c.interval * c.ease * 1.3) : 2; }
  c.due = Date.now() + Math.max(0, c.interval) * FC_DAY; c.last = Date.now(); sched[idx] = c; fcSave(sched);
}
function renderFlashcards(root) {
  if (!root) root = document.getElementById('root');
  if (!fc.queue || fc.queue.length === 0) { state.view = 'home'; render(); return; }
  if (fc.i >= fc.queue.length) {
    root.innerHTML = '<div class="container"><div class="page-header"><button class="back-btn" aria-label="Go back" onclick="fcToConfig()">&#8592;</button><h1>Flashcards</h1></div>'
      + '<div class="card" style="text-align:center;padding:34px;"><div style="font-size:42px;margin-bottom:8px;">&#x1F389;</div>'
      + '<h2>Deck complete</h2><p>You reviewed <strong>' + fc.total + '</strong> card' + (fc.total !== 1 ? 's' : '') + '.'
      + (fc.again ? ' ' + fc.again + ' came back for another look.' : '') + '</p>'
      + '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">'
      + '<button class="btn primary" id="fcMore">Study more &#8594;</button><button class="btn" id="fcPick">Change topics</button><button class="btn" id="fcHome">Home</button></div></div></div>';
    var mm = document.getElementById('fcMore'); if (mm) mm.onclick = function () { fcStart(); };
    var pk = document.getElementById('fcPick'); if (pk) pk.onclick = function () { fcToConfig(); };
    var hh = document.getElementById('fcHome'); if (hh) hh.onclick = function () { goHome(); };
    return;
  }
  var idx = fc.queue[fc.i]; var q = QUESTIONS[idx]; var pct = Math.round(100 * fc.i / fc.queue.length);
  var ansText = q.options[q.answer];
  var expl = q.explanation ? '<div class="fc-expl">' + escHtml(q.explanation) + '</div>' : '';
  var tag = escHtml(q.subject) + ' &#183; ' + escHtml(q.topic);
  root.innerHTML = '<div class="container"><div class="page-header">'
    + '<button class="back-btn" aria-label="Go back" onclick="fcToConfig()">&#8592;</button>'
    + '<h1>Flashcards' + (fc.cram ? ' &#183; Cram' : '') + '</h1>'
    + '<div class="ph-actions" style="color:var(--text-muted);font-size:13px;">' + (fc.i + 1) + ' / ' + fc.queue.length + '</div></div>'
    + '<div class="fc-stage"><div class="fc-prog"><div style="width:' + pct + '%"></div></div>'
    + '<div class="fc-card' + (fc.flipped ? ' flipped' : '') + '" id="fcCard"><div class="fc-inner">'
    + '<div class="fc-face fc-front"><div class="fc-tag">' + tag + '</div><div class="fc-q">' + escHtml(q.q) + '</div></div>'
    + '<div class="fc-face fc-back"><div class="fc-tag">' + tag + '</div><div class="fc-a-label">Answer</div><div class="fc-a">' + escHtml(ansText) + '</div>' + expl + '</div>'
    + '</div></div>'
    + (fc.flipped
        ? '<div class="fc-rate"><button class="again" data-r="again">Again<small>&lt; 1 min</small></button><button class="good" data-r="good">Good<small>days</small></button><button class="easy" data-r="easy">Easy<small>longer</small></button></div>'
        : '<div class="fc-hint">Tap the card or press <strong>Space</strong> to reveal</div>')
    + '</div></div>';
  var card = document.getElementById('fcCard');
  if (card) card.onclick = function () { if (!fc.flipped) { fc.flipped = true; renderFlashcards(root); } };
  var rs = root.querySelectorAll('.fc-rate button');
  for (var b = 0; b < rs.length; b++) { rs[b].onclick = (function (el) { return function () { fcAnswer(el.getAttribute('data-r')); }; })(rs[b]); }
}
function fcAnswer(rating) {
  var idx = fc.queue[fc.i]; fcGrade(idx, rating);
  if (rating === 'again') { fc.again++; fc.queue.push(idx); } else { fc.good++; }
  fc.i++; fc.flipped = false; renderFlashcards(document.getElementById('root'));
}
document.addEventListener('keydown', function (e) {
  if (typeof state === 'undefined' || state.view !== 'flashcards') return;
  var ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
    if (!fc.flipped && fc.i < fc.queue.length) { e.preventDefault(); fc.flipped = true; renderFlashcards(document.getElementById('root')); }
  } else if (fc.flipped) {
    if (e.key === '1') { e.preventDefault(); fcAnswer('again'); }
    else if (e.key === '2') { e.preventDefault(); fcAnswer('good'); }
    else if (e.key === '3') { e.preventDefault(); fcAnswer('easy'); }
  }
});
fcInjectStyles();

/* ====== REVIEW WRONG ANSWERS ====== */
function initReviewWrong() {
  const wrongMap = getWrong();
  const ids = Object.keys(wrongMap).map(n => parseInt(n));
  if (ids.length === 0) return;
  state.qIds = shuffle(ids);
  state.answers = state.qIds.map(idx => ({ qIdx: idx, selected: null }));
  state.index = 0;
  state.quizMode = 'review-wrong';
  state.view = 'review-wrong';
  render();
}

/* ====== DASHBOARD ====== */
function renderDashboard(root) {
  const hist = getHistory();
  const wrong = Object.keys(getWrong()).length;
  let avg = 0, totalAnswered = 0, totalCorrect = 0;
  const bySubj = {};
  hist.forEach(r => {
    totalAnswered += r.questionCount;
    totalCorrect += r.correct;
    Object.entries(r.subjectStats || {}).forEach(([s, st]) => {
      if (!bySubj[s]) bySubj[s] = { correct: 0, total: 0 };
      bySubj[s].correct += st.correct;
      bySubj[s].total += st.total;
    });
  });
  if (totalAnswered > 0) avg = Math.round(100*totalCorrect/totalAnswered);
  // Worst subject
  let worst = '—'; let worstPct = 101;
  Object.entries(bySubj).forEach(([s, st]) => {
    const p = st.total ? Math.round(100*st.correct/st.total) : 0;
    if (p < worstPct && st.total >= 5) { worstPct = p; worst = s; }
  });

  let table;
  if (hist.length === 0) {
    table = `<div class="card empty-state"><div class="ico">📋</div><h3>No sessions yet</h3><p>Take a Practice or Exam to see your history here.</p></div>`;
  } else {
    table = `<div class="history-table">
      <div class="history-row header"><div>Date</div><div>Type</div><div>Qs</div><div>Subjects</div><div>Score</div></div>
      ${hist.map(r => {
        const sc = scoreClass(r.score);
        return `<div class="history-row" data-id="${r.id}">
          <div>${fmtDate(r.date)}</div>
          <div><span class="ht-type ${r.type === 'exam' ? 'exam' : ''}">${r.type === 'exam' ? 'Exam' : 'Practice'}</span></div>
          <div>${r.questionCount}</div>
          <div>${Object.entries(r.subjectStats || {}).map(([s,st]) => `<small style="color:var(--text-muted);margin-right:6px">${s.slice(0,3)}: ${st.correct}/${st.total}</small>`).join('')}</div>
          <div class="ht-score ${sc}">${r.score}%</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  root.innerHTML = `
    <div class="container">
      <div class="page-header">
        <button class="back-btn" onclick="goHome()">←</button>
        <h1>Performance Dashboard</h1>
      </div>
      <div class="dash-grid">
        <div class="stat-tile"><div class="tile-val">${hist.length}</div><div class="tile-label">Sessions</div></div>
        <div class="stat-tile"><div class="tile-val ${scoreClass(avg)}">${hist.length ? avg + '%' : '—'}</div><div class="tile-label">Average score</div></div>
        <div class="stat-tile"><div class="tile-val">${totalAnswered}</div><div class="tile-label">Total questions</div></div>
        <div class="stat-tile"><div class="tile-val bad">${wrong}</div><div class="tile-label">In wrong-answer pool</div></div>
        <div class="stat-tile"><div class="tile-val" style="font-size:15px;">${escHtml(worst)}</div><div class="tile-label">Weakest subject</div></div>
      </div>
      ${Object.keys(bySubj).length > 0 ? `
        <div class="bd-section" style="margin-bottom:18px;">
          <h3>Lifetime accuracy by subject</h3>
          ${renderBreakdown(bySubj, true)}
        </div>
      ` : ''}
      ${table}
    </div>
  `;
  document.querySelectorAll('.history-row[data-id]').forEach(row => {
    row.onclick = () => {
      const id = row.dataset.id;
      const rec = getHistory().find(r => r.id === id);
      if (!rec) return;
      state.viewingExam = rec;
      state.view = 'exam-detail';
      render();
    };
  });
}

function renderExamDetail(root) {
  const r = state.viewingExam;
  if (!r) { state.view = 'dashboard'; render(); return; }
  root.innerHTML = `
    <div class="container">
      <div class="page-header">
        <button class="back-btn" onclick="state.view='dashboard';render()">←</button>
        <h1>${r.type === 'exam' ? 'Exam' : 'Practice'} Details</h1>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
          <div>
            <h3 style="margin:0;">${fmtDate(r.date)}</h3>
            <p style="margin:4px 0 0;">${r.questionCount} questions · ${r.correct} correct · ${r.wrong} wrong</p>
          </div>
          <div style="font-size: 36px; font-weight: 800; color: var(--${scoreClass(r.score) === 'good' ? 'good' : scoreClass(r.score) === 'warn' ? 'warn' : 'bad'});">${r.score}%</div>
        </div>
      </div>
      <div class="bd-section">
        <h3>By Subject</h3>
        ${renderBreakdown(r.subjectStats || {}, true)}
      </div>
      <div class="bd-section">
        <h3>By Topic</h3>
        ${renderTopicBreakdown(r.topicStats || {})}
      </div>
      <div style="margin-top:16px;">
        <button class="btn primary" id="reviewBtn">Review All Questions</button>
      </div>
    </div>
  `;
  document.getElementById('reviewBtn').onclick = () => {
    state.qIds = r.qIds.slice();
    state.answers = r.qIds.map((qIdx, i) => ({ qIdx, selected: r.answers[i] }));
    state.index = 0;
    state.quizMode = 'review-after-exam';
    state.view = 'review-after-exam';
    render();
  };
}

/* Add review-after-exam route */
const originalRender = render;
render = function() {
  if (state.view === 'review-after-exam') {
    updateTopbar();
    renderReviewAfterExam(document.getElementById('root'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  originalRender();
};

/* ====== STUDENT UX ENHANCEMENTS (keyboard + a11y/polish; additive, no engine edits) ====== */
(function(){
  var s = document.createElement('style');
  s.textContent = [
    ':where(button,a[href],[tabindex],.option,.length-opt,.report-reason,.mode-card):focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:var(--radius-xs,6px)}',
    '.mode-card:focus-visible,.option:focus-visible{outline-offset:3px}',
    '.qpb-value,.big-score,.score-label,.tile-val,.q-tag,.badge,.length-opt{font-variant-numeric:tabular-nums}',
    'h1,h2,h3{text-wrap:balance}.q-text,p{text-wrap:pretty}',
    '::selection{background:var(--brand);color:#fff}::-moz-selection{background:var(--brand);color:#fff}',
    '*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}',
    '::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}',
    '::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box}',
    'button,.option,.length-opt,.mode-card{touch-action:manipulation}',
    ':root,[data-theme="dark"]{color-scheme:dark}[data-theme="light"]{color-scheme:light}',
    '@supports (min-height:100dvh){body{min-height:100dvh}}',
    '.kbd-hint2{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:60;font-size:11px;font-weight:600;color:var(--text-muted,#888);background:var(--surface,#fff);border:1px solid var(--border,#ccc);border-radius:999px;padding:5px 13px;opacity:.9;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}',
    '@media (hover:none),(pointer:coarse){.kbd-hint2{display:none}}',
    '@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}'
  ].join('');
  document.head.appendChild(s);

  var QUIZ_VIEWS = ['practice','exam','review-wrong','study'];
  var SKIP = /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/;
  function overlayOpen(){ return !!document.querySelector('.report-overlay,.labobo-announce-overlay,.modal-overlay'); }
  function inQuiz(){ return (typeof state !== 'undefined') && state && QUIZ_VIEWS.indexOf(state.view) !== -1; }
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!inQuiz() || overlayOpen()) return;
    var ae = document.activeElement;
    if (ae && (SKIP.test(ae.tagName) || ae.isContentEditable)) return;
    var k = e.key, pos = -1;
    if (k >= '1' && k <= '6') pos = k.charCodeAt(0) - 49;
    else if (/^[a-fA-F]$/.test(k)) pos = k.toUpperCase().charCodeAt(0) - 65;
    if (pos >= 0) {
      var opts = document.querySelectorAll('.option[data-i]');
      if (opts[pos] && !opts[pos].classList.contains('disabled')) { e.preventDefault(); opts[pos].click(); }
      return;
    }
    if (k === 'ArrowRight' || k === 'Enter') {
      var nx = document.getElementById('nextBtn') || document.getElementById('finishPracticeBtn') || document.getElementById('finishExamBtn');
      if (nx && !nx.disabled) { e.preventDefault(); nx.click(); }
    } else if (k === 'ArrowLeft') {
      var pv = document.getElementById('prevBtn');
      if (pv && !pv.disabled) { e.preventDefault(); pv.click(); }
    }
  });

  var hintShown = false;
  function maybeHint(){
    if (hintShown || !inQuiz()) return;
    if (window.matchMedia && window.matchMedia('(hover:none)').matches) return;
    hintShown = true;
    var h = document.createElement('div');
    h.className = 'kbd-hint2';
    h.textContent = '⌨️ 1–4 answer · ← → navigate · Enter next';
    document.body.appendChild(h);
    setTimeout(function(){ h.style.transition='opacity .5s'; h.style.opacity='0'; setTimeout(function(){ if(h.parentNode) h.remove(); }, 600); }, 6000);
  }
  document.addEventListener('keydown', maybeHint, true);
  document.addEventListener('mousedown', maybeHint, true);
})();
/* ====== BOOTSTRAP ====== */
if (state.user) state.view = 'home';
render();
</script>
