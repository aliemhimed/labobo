<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="Arial, Helvetica, sans-serif">
<rect width="680" height="220" fill="#ffffff"/>
<text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3c5e">PPE Donning (Putting On) Sequence</text>
<g font-size="14" fill="#1a3c5e">
<rect x="30"  y="80" width="120" height="60" rx="10" fill="#eaf2fb" stroke="#4a7fb5"/><text x="90"  y="108" text-anchor="middle" font-weight="bold">1. Gown</text><text x="90" y="128" text-anchor="middle" font-size="11">tie neck &amp; waist</text>
<rect x="190" y="80" width="120" height="60" rx="10" fill="#eaf2fb" stroke="#4a7fb5"/><text x="250" y="108" text-anchor="middle" font-weight="bold">2. Mask</text><text x="250" y="128" text-anchor="middle" font-size="11">cover nose &amp; mouth</text>
<rect x="350" y="80" width="120" height="60" rx="10" fill="#eaf2fb" stroke="#4a7fb5"/><text x="410" y="108" text-anchor="middle" font-weight="bold">3. Goggles</text><text x="410" y="128" text-anchor="middle" font-size="11">eye protection</text>
<rect x="510" y="80" width="120" height="60" rx="10" fill="#eaf2fb" stroke="#4a7fb5"/><text x="570" y="108" text-anchor="middle" font-weight="bold">4. Gloves</text><text x="570" y="128" text-anchor="middle" font-size="11">over gown cuff</text>
</g>
<polygon points="152,110 188,110 184,104 188,116" fill="#4a7fb5"/>
<polygon points="312,110 348,110 344,104 348,116" fill="#4a7fb5"/>
<polygon points="472,110 508,110 504,104 508,116" fill="#4a7fb5"/>
<text x="340" y="180" text-anchor="middle" font-size="13" fill="#777">Removal is the reverse idea: gloves first, hand hygiene throughout.</text>
</svg>
