<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" font-family="Arial, Helvetica, sans-serif">
<rect width="380" height="480" fill="#ffffff"/>
<text x="190" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3c5e">Common Pulse Points</text>
<!-- simple body -->
<circle cx="190" cy="78" r="26" fill="#f1c9a8" stroke="#b07a55"/>
<rect x="158" y="104" width="64" height="120" rx="14" fill="#f1c9a8" stroke="#b07a55"/>
<rect x="120" y="112" width="38" height="120" rx="12" fill="#f1c9a8" stroke="#b07a55"/>
<rect x="222" y="112" width="38" height="120" rx="12" fill="#f1c9a8" stroke="#b07a55"/>
<rect x="160" y="224" width="28" height="150" rx="12" fill="#f1c9a8" stroke="#b07a55"/>
<rect x="192" y="224" width="28" height="150" rx="12" fill="#f1c9a8" stroke="#b07a55"/>
<!-- dots + labels -->
<circle cx="178" cy="92" r="5" fill="#c0392b"/><text x="250" y="70" font-size="13" fill="#1a3c5e">Carotid (neck)</text><line x1="182" y1="92" x2="246" y2="66" stroke="#c0392b"/>
<circle cx="190" cy="150" r="5" fill="#c0392b"/><text x="250" y="120" font-size="13" fill="#1a3c5e">Apical (chest)</text><line x1="194" y1="150" x2="246" y2="116" stroke="#c0392b"/>
<circle cx="126" cy="226" r="5" fill="#c0392b"/><text x="10" y="232" font-size="13" fill="#1a3c5e">Radial (wrist)</text><line x1="122" y1="226" x2="78" y2="228" stroke="#c0392b"/>
<circle cx="170" cy="236" r="5" fill="#c0392b"/><text x="250" y="240" font-size="13" fill="#1a3c5e">Femoral (groin)</text><line x1="174" y1="236" x2="246" y2="236" stroke="#c0392b"/>
<circle cx="174" cy="372" r="5" fill="#c0392b"/><text x="250" y="372" font-size="13" fill="#1a3c5e">Pedal (foot)</text><line x1="178" y1="372" x2="246" y2="370" stroke="#c0392b"/>
<text x="190" y="460" text-anchor="middle" font-size="12" fill="#777">Radial is most commonly used; never use the thumb to palpate.</text>
</svg>
