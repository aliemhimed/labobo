[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # The handle validator reads shared/profanity-patterns.json, which lives
  # outside the functions folder.
  included_files = ["shared/**"]

# Friendly URL rewrites: /api/* -> /.netlify/functions/*
[[redirects]]
  from = "/api/supa-insert"
  to   = "/.netlify/functions/supa-insert"
  status = 200

[[redirects]]
  from = "/api/leaderboard"
  to   = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/admin"
  to   = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/announcements"
  to   = "/.netlify/functions/announcements"
  status = 200

[[redirects]]
  from = "/api/questions"
  to   = "/.netlify/functions/questions"
  status = 200

# SPA fallback — every other path is handled by React Router.
# Must stay last so it doesn't shadow the /api rules above.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security headers for every response.
# CSP notes: styles need 'unsafe-inline' (React style props and the legacy
# modules inject <style>); scripts do not. The one inline <script> in
# index.html (sets data-theme before first paint) is allowed by its hash; if
# you edit that script, regenerate the sha256 in script-src below.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ZZo1XePxAGdOIbaOwlfIpc21qtMDm19Ul2BxvtSVxmw=' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://aliemhimed.goatcounter.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Caching. Vite fingerprints everything under /assets, so it can be cached
# forever. Images and icons keep their names, so give them a long but finite
# lifetime and let the CDN revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/memes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/theme/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
