<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Labobo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="theme/Line Art  Favicon version.png" type="image/png">
<style>
:root {
  --brand: #2B7FFF; --brand-dark: #1D6AE5; --brand-soft: rgba(43,127,255,0.12);
  --correct: #16A34A; --review: #D97706; --wrong: #DC2626;
  --radius: 14px; --radius-sm: 10px;
}
[data-theme="dark"] {
  --bg: #0B1220; --surface: #111A2E; --surface-raised: #162035;
  --border: #1E2D47; --border-strong: #243858;
  --text: #E8EEFF; --text-soft: #8BA3CC; --text-muted: #4D6488;
  --shadow-md: 0 4px 16px rgba(0,0,0,0.55);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.65);
}
[data-theme="light"] {
  --bg: #F0F4FF; --surface: #FFFFFF; --surface-raised: #F1F5F9;
  --border: #D8E3F0; --border-strong: #B8CCE4;
  --text: #0F172A; --text-soft: #475569; --text-muted: #94A3B8;
  --shadow-md: 0 4px 12px rgba(15,23,42,0.09);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  -webkit-font-smoothing: antialiased; line-height: 1.55;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; gap: 12px; flex-wrap: wrap;
}
.topbar h1 {
  font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.topbar h1 .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--correct); box-shadow: 0 0 12px var(--correct);
  animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: 0.5; } }
.topbar-right { display: flex; gap: 8px; align-items: center; }

.btn {
  padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; border: 1px solid var(--border);
  background: var(--surface-raised); color: var(--text);
  transition: background 0.15s, transform 0.1s;
}
.btn:hover { background: var(--border); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brand); color: #fff; border-color: transparent;
  box-shadow: 0 2px 8px rgba(43,127,255,0.3);
}
.btn-primary:hover { background: var(--brand-dark); }
.btn-danger { color: var(--wrong); border-color: var(--wrong); background: transparent; }
.btn-danger:hover { background: var(--wrong); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }

/* Stats grid */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px;
  box-shadow: var(--shadow-md);
}
.stat .label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted); font-weight: 700; margin-bottom: 4px;
}
.stat .value {
  font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;
  color: var(--text);
}
.stat .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Tabs */
.tabs {
  display: flex; gap: 4px; margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab {
  padding: 10px 16px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--text-soft); border-bottom: 2px solid transparent;
  white-space: nowrap; transition: color 0.15s, border-color 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--brand); border-color: var(--brand); }

/* Toolbar (filters above table) */
.toolbar {
  display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;
}
.input, .select {
  padding: 8px 12px; border-radius: 9px; font-size: 13px; font-family: inherit;
  background: var(--surface-raised); border: 1px solid var(--border); color: var(--text);
  outline: none; min-width: 200px;
}
.input:focus, .select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

/* Table */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-md);
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse;
  font-size: 13.5px;
}
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted); font-weight: 700; padding: 11px 12px;
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1;
}
td {
  padding: 11px 12px; border-bottom: 1px solid var(--border);
  vertical-align: top; word-break: break-word;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-raised); }
.mono { font-family: 'Space Grotesk', 'SF Mono', monospace; font-size: 12px; color: var(--text-soft); }
.muted { color: var(--text-muted); font-size: 12px; }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; background: var(--brand-soft); color: var(--brand);
}
.pill-warn { background: rgba(217,119,6,0.15); color: var(--review); }
.pill-bad  { background: rgba(220,38,38,0.15); color: var(--wrong); }
.pill-good { background: rgba(22,163,74,0.15); color: var(--correct); }

.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .icon { font-size: 40px; opacity: 0.5; margin-bottom: 10px; }
.loading { padding: 60px 20px; text-align: center; color: var(--text-muted); }

/* Password gate */
.gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.gate-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px; max-width: 380px; width: 100%;
  box-shadow: var(--shadow-lg);
}
.gate-box h2 {
  font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700;
  margin-bottom: 6px; text-align: center;
}
.gate-box p { color: var(--text-soft); font-size: 13.5px; text-align: center; margin-bottom: 18px; }
.gate-box input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: var(--surface-raised); border: 1.5px solid var(--border); color: var(--text);
  font-size: 15px; font-family: inherit; outline: none; margin-bottom: 12px;
}
.gate-box input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.gate-box button { width: 100%; padding: 12px; }
.gate-err {
  color: var(--wrong); font-size: 13px; margin-top: 8px; text-align: center;
  min-height: 18px;
}

/* Question reports — long body */
.report-body {
  background: var(--surface-raised); padding: 10px 12px; border-radius: 8px;
  font-size: 12.5px; color: var(--text-soft); white-space: pre-wrap; max-width: 420px;
  margin-top: 4px;
}

/* Announcements composer */
.ann-form {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 16px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.ann-form .full { grid-column: 1 / -1; }
.ann-form label {
  display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
}
.ann-form input[type=text],
.ann-form input[type=date],
.ann-form textarea {
  width: 100%; padding: 10px 12px; border-radius: 9px; font-size: 13.5px;
  font-family: inherit; background: var(--surface-raised);
  border: 1.5px solid var(--border); color: var(--text); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.ann-form input:focus, .ann-form textarea:focus {
  border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);
}
.ann-form textarea { min-height: 110px; resize: vertical; font-family: inherit; line-height: 1.55; }
.ann-form .row-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.ann-form .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
.ann-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); cursor: pointer; }
.ann-checkbox input { width: 16px; height: 16px; accent-color: var(--brand); }
.ann-preview {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.ann-preview .pv-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
}
.ann-preview .pv-title {
  font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700;
  color: var(--text); margin-bottom: 6px;
}
.ann-preview .pv-body { font-size: 13.5px; color: var(--text-soft); line-height: 1.55; }
.ann-preview .pv-body a { color: var(--brand); }

.ann-status-active   { color: var(--correct); }
.ann-status-inactive { color: var(--text-muted); }

@media (max-width: 720px) {
  .ann-form { grid-template-columns: 1fr; }
}

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-left: 4px solid var(--brand);
  padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 100;
}
.toast.err { border-left-color: var(--wrong); }
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="gate-box">
    <h2>🔒 Labobo Admin</h2>
    <p>Enter the admin password to continue.</p>
    <input type="password" id="gate-input" placeholder="Password" autofocus>
    <button class="btn btn-primary" id="gate-submit">Unlock</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<!-- Main app (hidden until unlocked) -->
<div id="app" class="wrap" style="display:none;">

  <div class="topbar">
    <h1><span class="pulse"></span> Labobo Admin</h1>
    <div class="topbar-right">
      <button class="btn btn-sm" id="refresh-btn">↻ Refresh</button>
      <button class="btn btn-sm" id="theme-btn">Theme</button>
      <button class="btn btn-sm btn-danger" id="logout-btn">Lock</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="reports">📋 Reports</div>
    <div class="tab" data-tab="leaderboard">🏆 Leaderboard</div>
    <div class="tab" data-tab="users">👤 Users</div>
    <div class="tab" data-tab="sessions">📊 Sessions</div>
    <div class="tab" data-tab="announcements">📣 Announcements</div>
  </div>

  <div id="panel"></div>
</div>

<script>
/* ============================================================
   ADMIN DASHBOARD CLIENT
   ============================================================ */
const API = '/api/admin';
const PW_KEY = 'labobo_admin_pw';

function $(sel) { return document.querySelector(sel); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
}
function timeAgo(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  const ms = Date.now() - d.getTime();
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h / 24);
  return `${days}d ago`;
}
function toast(msg, isErr = false) {
  const t = el('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.4s'; t.style.opacity = '0';
    setTimeout(() => t.remove(), 400);
  }, 3000);
}

/* ---------- Theme ---------- */
(function initTheme() {
  const saved = localStorage.getItem('labobo_admin_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('labobo_admin_theme', next);
}

/* ---------- Auth ---------- */
function getPassword() { return sessionStorage.getItem(PW_KEY) || ''; }
function setPassword(pw) { sessionStorage.setItem(PW_KEY, pw); }
function clearPassword() { sessionStorage.removeItem(PW_KEY); }

async function apiCall(method, action, opts = {}) {
  const qs = new URLSearchParams({ action, ...(opts.params || {}) }).toString();
  const res = await fetch(`${API}?${qs}`, {
    method,
    headers: {
      'X-Admin-Password': getPassword(),
      ...(opts.body ? { 'Content-Type': 'application/json' } : {})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) {
    clearPassword();
    location.reload();
    return;
  }
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* ---------- Gate flow ---------- */
async function tryUnlock(pw) {
  setPassword(pw);
  try {
    await apiCall('GET', 'stats');
    return true;
  } catch (e) {
    clearPassword();
    return false;
  }
}

$('#gate-submit').addEventListener('click', async () => {
  const pw = $('#gate-input').value;
  if (!pw) return;
  $('#gate-err').textContent = '';
  $('#gate-submit').disabled = true;
  const ok = await tryUnlock(pw);
  $('#gate-submit').disabled = false;
  if (ok) bootApp();
  else $('#gate-err').textContent = 'Wrong password.';
});
$('#gate-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#gate-submit').click();
});

/* ---------- App init ---------- */
async function bootApp() {
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';
  $('#refresh-btn').addEventListener('click', refreshAll);
  $('#theme-btn').addEventListener('click', toggleTheme);
  $('#logout-btn').addEventListener('click', () => { clearPassword(); location.reload(); });
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });
  await refreshAll();
}

let currentTab = 'reports';
async function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  await renderTab();
}
async function refreshAll() {
  await Promise.all([loadStats(), renderTab()]);
}

/* ---------- Stats ---------- */
async function loadStats() {
  const wrap = $('#stats');
  wrap.innerHTML = '<div class="stat"><div class="label">Loading…</div></div>';
  try {
    const s = await apiCall('GET', 'stats');
    wrap.innerHTML = '';
    const items = [
      { label: 'Users', value: s.users, sub: 'total registered' },
      { label: 'Sessions', value: s.sessions, sub: 'all time' },
      { label: 'Today', value: s.sessions_today, sub: 'sessions in last 24h' },
      { label: 'Reports', value: s.reports, sub: 'question_reports' },
      { label: 'Leaderboard', value: s.leaderboard_this_week, sub: `this week (${s.week_start})` }
    ];
    for (const it of items) {
      wrap.appendChild(el('div', { class: 'stat' },
        el('div', { class: 'label' }, it.label),
        el('div', { class: 'value' }, String(it.value ?? '—')),
        el('div', { class: 'sub' }, it.sub)
      ));
    }
  } catch (e) {
    wrap.innerHTML = `<div class="stat"><div class="label">Error</div><div class="value" style="font-size:14px;color:var(--wrong);">${esc(e.message)}</div></div>`;
  }
}

/* ---------- Tab dispatch ---------- */
async function renderTab() {
  const panel = $('#panel');
  panel.innerHTML = '<div class="card"><div class="loading">Loading…</div></div>';
  try {
    if (currentTab === 'reports')       return await renderReports(panel);
    if (currentTab === 'leaderboard')   return await renderLeaderboard(panel);
    if (currentTab === 'users')         return await renderUsers(panel);
    if (currentTab === 'sessions')      return await renderSessions(panel);
    if (currentTab === 'announcements') return await renderAnnouncements(panel);
  } catch (e) {
    panel.innerHTML = `<div class="card"><div class="empty"><div class="icon">⚠️</div>${esc(e.message)}</div></div>`;
  }
}

/* ---------- Reports tab ---------- */
async function renderReports(panel) {
  const data = await apiCall('GET', 'reports');
  const rows = data.rows || [];
  if (!rows.length) {
    panel.innerHTML = '<div class="card"><div class="empty"><div class="icon">🎉</div>No reports — questions are clean.</div></div>';
    return;
  }
  const card = el('div', { class: 'card' });
  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table');
  const thead = el('thead', null,
    el('tr', null,
      el('th', null, 'When'),
      el('th', null, 'Subject / Topic'),
      el('th', null, 'Reason'),
      el('th', null, 'Question + Note'),
      el('th', null, 'Device'),
      el('th', null, '')
    )
  );
  const tbody = el('tbody');
  rows.forEach(r => {
    const dateCell = el('td', null,
      el('div', null, fmtDate(r.created_at)),
      el('div', { class: 'muted' }, timeAgo(r.created_at))
    );
    const subjCell = el('td', null,
      el('div', null, el('span', { class: 'pill' }, r.subject || '—')),
      r.topic ? el('div', { class: 'muted', style: 'margin-top:4px;' }, r.topic) : null
    );
    const reasonCell = el('td', null,
      r.reason ? el('span', { class: 'pill pill-warn' }, r.reason) : el('span', { class: 'muted' }, '—')
    );
    const noteCell = el('td');
    if (r.question_text) noteCell.appendChild(el('div', { class: 'muted', style: 'margin-bottom:6px;' },
      (r.question_text || '').slice(0, 180) + (r.question_text && r.question_text.length > 180 ? '…' : '')
    ));
    if (r.note) noteCell.appendChild(el('div', { class: 'report-body' }, r.note));
    if (!noteCell.childNodes.length) noteCell.appendChild(el('span', { class: 'muted' }, '(no details)'));
    const byCell = el('td', { class: 'mono' }, (r.device_id || '').slice(0, 12));
    const actCell = el('td', null,
      el('button', { class: 'btn btn-sm btn-danger', onclick: () => deleteReport(r.id) }, 'Dismiss')
    );
    tbody.appendChild(el('tr', null, dateCell, subjCell, reasonCell, noteCell, byCell, actCell));
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  panel.innerHTML = '';
  panel.appendChild(card);
}
async function deleteReport(id) {
  if (!confirm('Dismiss this report?')) return;
  try {
    await apiCall('DELETE', 'report', { params: { id } });
    toast('Report dismissed');
    await refreshAll();
  } catch (e) { toast(e.message, true); }
}

/* ---------- Leaderboard tab ---------- */
let lbWeek = null;
async function renderLeaderboard(panel) {
  const data = await apiCall('GET', 'leaderboard', { params: lbWeek ? { week: lbWeek } : {} });
  const rows = data.rows || [];
  const weeks = data.weeks || [];
  if (!lbWeek) lbWeek = data.week_start;

  const card = el('div', { class: 'card' });

  // Toolbar
  const toolbar = el('div', { class: 'toolbar', style: 'padding:12px 14px;border-bottom:1px solid var(--border);' });
  toolbar.appendChild(el('label', { class: 'muted', style: 'font-size:12px;' }, 'Week:'));
  const sel = el('select', { class: 'select' });
  const weekSet = new Set([lbWeek, ...weeks]);
  [...weekSet].sort().reverse().forEach(w => {
    const o = el('option', { value: w }, w + (w === data.week_start ? ' (current)' : ''));
    if (w === lbWeek) o.setAttribute('selected', 'selected');
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => { lbWeek = sel.value; renderTab(); });
  toolbar.appendChild(sel);
  toolbar.appendChild(el('span', { class: 'muted' }, `${rows.length} entries`));
  card.appendChild(toolbar);

  if (!rows.length) {
    card.appendChild(el('div', { class: 'empty' },
      el('div', { class: 'icon' }, '🌱'),
      'No leaderboard entries for this week.'
    ));
    panel.innerHTML = '';
    panel.appendChild(card);
    return;
  }

  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table');
  const thead = el('thead', null,
    el('tr', null,
      el('th', null, '#'),
      el('th', null, 'Handle'),
      el('th', null, 'Subject'),
      el('th', null, 'Score'),
      el('th', null, 'Time'),
      el('th', null, 'When'),
      el('th', null, 'Device'),
      el('th', null, '')
    )
  );
  const tbody = el('tbody');
  rows.forEach((r, i) => {
    tbody.appendChild(el('tr', null,
      el('td', { class: 'mono' }, String(i + 1)),
      el('td', null, el('strong', null, r.handle || '—')),
      el('td', null, el('span', { class: 'pill' }, r.subject || '—')),
      el('td', { class: 'mono' }, `${Number(r.score_pct ?? 0).toFixed(0)}%`),
      el('td', { class: 'mono' }, r.time_seconds != null ? `${Math.floor(r.time_seconds/60)}:${String(r.time_seconds%60).padStart(2,'0')}` : '—'),
      el('td', null,
        el('div', null, fmtDate(r.completed_at)),
        el('div', { class: 'muted' }, timeAgo(r.completed_at))
      ),
      el('td', { class: 'mono' }, (r.device_id || '').slice(0, 12)),
      el('td', null,
        el('button', { class: 'btn btn-sm btn-danger', onclick: () => deleteLb(r.id, r.handle) }, 'Remove')
      )
    ));
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  panel.innerHTML = '';
  panel.appendChild(card);
}
async function deleteLb(id, handle) {
  if (!confirm(`Remove leaderboard entry "${handle}"? They can re-submit next time they finish an exam.`)) return;
  try {
    await apiCall('DELETE', 'leaderboard', { params: { id } });
    toast('Entry removed');
    await refreshAll();
  } catch (e) { toast(e.message, true); }
}

/* ---------- Users tab ---------- */
async function renderUsers(panel) {
  const data = await apiCall('GET', 'users');
  const rows = data.rows || [];
  if (!rows.length) {
    panel.innerHTML = '<div class="card"><div class="empty"><div class="icon">👥</div>No users yet.</div></div>';
    return;
  }
  const card = el('div', { class: 'card' });
  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table');
  const thead = el('thead', null,
    el('tr', null,
      el('th', null, 'Name'),
      el('th', null, 'Joined'),
      el('th', null, 'Device ID')
    )
  );
  const tbody = el('tbody');
  rows.forEach(r => {
    tbody.appendChild(el('tr', null,
      el('td', null, el('strong', null, r.name || '—')),
      el('td', null,
        el('div', null, fmtDate(r.joined)),
        el('div', { class: 'muted' }, timeAgo(r.joined))
      ),
      el('td', { class: 'mono' }, r.device_id || r.id || '')
    ));
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  panel.innerHTML = '';
  panel.appendChild(card);
}

/* ---------- Sessions tab ---------- */
async function renderSessions(panel) {
  const data = await apiCall('GET', 'sessions', { params: { limit: 200 } });
  const rows = data.rows || [];
  if (!rows.length) {
    panel.innerHTML = '<div class="card"><div class="empty"><div class="icon">📊</div>No sessions yet.</div></div>';
    return;
  }
  const card = el('div', { class: 'card' });
  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table');
  const thead = el('thead', null,
    el('tr', null,
      el('th', null, 'When'),
      el('th', null, 'Subject'),
      el('th', null, 'Mode'),
      el('th', null, 'Score'),
      el('th', null, '%'),
      el('th', null, 'Device')
    )
  );
  const tbody = el('tbody');
  rows.forEach(r => {
    const pct = r.pct != null ? Number(r.pct) : (r.total ? Math.round(r.score / r.total * 100) : null);
    const pctCls = pct == null ? '' : (pct >= 75 ? 'pill-good' : (pct >= 50 ? 'pill-warn' : 'pill-bad'));
    tbody.appendChild(el('tr', null,
      el('td', null,
        el('div', null, fmtDate(r.created_at)),
        el('div', { class: 'muted' }, timeAgo(r.created_at))
      ),
      el('td', null, el('span', { class: 'pill' }, r.subject || '—')),
      el('td', null, r.mode || '—'),
      el('td', { class: 'mono' }, `${r.score ?? '—'}/${r.total ?? '—'}`),
      el('td', null, pct == null ? '—' : el('span', { class: 'pill ' + pctCls }, `${pct}%`)),
      el('td', { class: 'mono' }, (r.device_id || '').slice(0, 12))
    ));
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  panel.innerHTML = '';
  panel.appendChild(card);
}

/* ---------- Announcements tab ---------- */
function slugify(s) {
  return String(s || '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}
function todayISODate() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function suggestId(title) {
  const slug = slugify(title);
  if (!slug) return '';
  const ym = todayISODate().slice(0, 7); // 2026-05
  return `${slug}-${ym}`;
}

async function renderAnnouncements(panel) {
  const data = await apiCall('GET', 'announcements');
  const rows = data.rows || [];

  const card = el('div', { class: 'card' });

  // ---------- Composer ----------
  const form = el('div', { class: 'ann-form' });
  form.innerHTML = `
    <div>
      <label>Title</label>
      <input type="text" id="ann-title" placeholder="e.g. 🎉 New: Question feedback button">
      <div class="hint">Emoji + plain text. Shown bold at the top of the popup.</div>
    </div>
    <div>
      <label>ID (slug)</label>
      <input type="text" id="ann-id" placeholder="auto from title">
      <div class="hint">Used so each user sees this announcement only once. Auto-fills from the title.</div>
    </div>
    <div class="full">
      <label>Body (HTML allowed)</label>
      <textarea id="ann-body" placeholder="Type the announcement. Use &lt;strong&gt;, &lt;em&gt;, &lt;br&gt;, &lt;a href=&quot;...&quot;&gt;link&lt;/a&gt; to format."></textarea>
      <div class="hint">Allowed tags: &lt;strong&gt;, &lt;em&gt;, &lt;br&gt;, &lt;a&gt;. Plain &amp;, &lt;, &gt; need to be written as &amp;amp; &amp;lt; &amp;gt;.</div>
    </div>
    <div>
      <label>Publish date</label>
      <input type="date" id="ann-date" value="${todayISODate()}">
    </div>
    <div>
      <label>Status</label>
      <label class="ann-checkbox"><input type="checkbox" id="ann-active" checked> Active (visible to users)</label>
      <div class="hint">Uncheck to save a draft / hide an old announcement without deleting it.</div>
    </div>
    <div class="full">
      <label>Live preview</label>
      <div class="ann-preview">
        <div class="pv-label">Preview</div>
        <div class="pv-title" id="pv-title">Title will appear here…</div>
        <div class="pv-body"  id="pv-body">Body will appear here…</div>
      </div>
    </div>
    <div class="full row-actions">
      <button class="btn btn-sm" id="ann-clear">Clear form</button>
      <button class="btn btn-sm btn-primary" id="ann-save">💾 Save announcement</button>
    </div>
  `;
  card.appendChild(form);

  // ---------- Existing list ----------
  const wrap = el('div', { class: 'table-wrap' });
  if (!rows.length) {
    wrap.appendChild(el('div', { class: 'empty' },
      el('div', { class: 'icon' }, '📣'),
      'No announcements yet. Fill in the form above and click Save.'
    ));
  } else {
    const table = el('table');
    table.appendChild(el('thead', null, el('tr', null,
      el('th', null, 'Status'),
      el('th', null, 'Title / ID'),
      el('th', null, 'Body preview'),
      el('th', null, 'Publish date'),
      el('th', null, 'Updated'),
      el('th', null, '')
    )));
    const tbody = el('tbody');
    rows.forEach(r => {
      const statusCell = el('td', null,
        el('span', { class: r.active ? 'pill pill-good' : 'pill' }, r.active ? 'Active' : 'Hidden')
      );
      const titleCell = el('td', null,
        el('div', { style: 'font-weight:600;' }, r.title || '(untitled)'),
        el('div', { class: 'mono', style: 'margin-top:3px;' }, r.id)
      );
      const bodyCell = el('td');
      bodyCell.innerHTML = `<div class="muted" style="max-width:360px;">${(r.body || '').replace(/<[^>]+>/g, ' ').slice(0, 200)}${(r.body || '').length > 200 ? '…' : ''}</div>`;
      const dateCell = el('td', null, r.pub_date || '—');
      const updCell  = el('td', null,
        el('div', null, fmtDate(r.updated_at)),
        el('div', { class: 'muted' }, timeAgo(r.updated_at))
      );
      const actCell = el('td');
      const editBtn = el('button', {
        class: 'btn btn-sm',
        style: 'margin-right:6px;',
        onclick: () => loadAnnIntoForm(r)
      }, 'Edit');
      const toggleBtn = el('button', {
        class: 'btn btn-sm',
        style: 'margin-right:6px;',
        onclick: () => toggleAnnActive(r)
      }, r.active ? 'Hide' : 'Activate');
      const delBtn = el('button', {
        class: 'btn btn-sm btn-danger',
        onclick: () => deleteAnnouncement(r.id)
      }, 'Delete');
      actCell.appendChild(editBtn);
      actCell.appendChild(toggleBtn);
      actCell.appendChild(delBtn);
      tbody.appendChild(el('tr', null, statusCell, titleCell, bodyCell, dateCell, updCell, actCell));
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }
  card.appendChild(wrap);

  panel.innerHTML = '';
  panel.appendChild(card);

  // ---------- Wire up form ----------
  const titleEl = panel.querySelector('#ann-title');
  const idEl    = panel.querySelector('#ann-id');
  const bodyEl  = panel.querySelector('#ann-body');
  const dateEl  = panel.querySelector('#ann-date');
  const activeEl = panel.querySelector('#ann-active');
  const pvTitle = panel.querySelector('#pv-title');
  const pvBody  = panel.querySelector('#pv-body');

  let idEdited = false;
  idEl.addEventListener('input', () => { idEdited = true; });
  function syncIdSuggestion() {
    if (!idEdited) idEl.value = suggestId(titleEl.value);
  }
  function updatePreview() {
    pvTitle.textContent = titleEl.value || 'Title will appear here…';
    pvBody.innerHTML = bodyEl.value || '<span class="muted">Body will appear here…</span>';
  }
  titleEl.addEventListener('input', () => { syncIdSuggestion(); updatePreview(); });
  bodyEl.addEventListener('input', updatePreview);

  panel.querySelector('#ann-clear').addEventListener('click', () => {
    titleEl.value = ''; idEl.value = ''; bodyEl.value = '';
    dateEl.value = todayISODate(); activeEl.checked = true;
    idEdited = false; updatePreview();
    titleEl.focus();
  });

  panel.querySelector('#ann-save').addEventListener('click', async () => {
    const payload = {
      id: (idEl.value || suggestId(titleEl.value)).trim(),
      title: titleEl.value.trim(),
      body: bodyEl.value.trim(),
      pub_date: dateEl.value || todayISODate(),
      active: !!activeEl.checked
    };
    if (!payload.title || !payload.body) {
      toast('Title and body are required', true);
      return;
    }
    if (!payload.id) {
      toast('Could not derive an ID — fill in the slug', true);
      return;
    }
    try {
      await apiCall('POST', 'announcement', { body: payload });
      toast(`Saved “${payload.title}” (${payload.id})`);
      await renderTab(); // reload list
    } catch (e) { toast(e.message, true); }
  });

  // Expose a few row handlers
  window._labobo_ann = {
    loadAnnIntoForm, toggleAnnActive, deleteAnnouncement
  };
}

function loadAnnIntoForm(r) {
  const panel = $('#panel');
  panel.querySelector('#ann-title').value = r.title || '';
  panel.querySelector('#ann-id').value    = r.id    || '';
  panel.querySelector('#ann-body').value  = r.body  || '';
  panel.querySelector('#ann-date').value  = r.pub_date || todayISODate();
  panel.querySelector('#ann-active').checked = !!r.active;
  // Refresh preview
  panel.querySelector('#pv-title').textContent = r.title || '';
  panel.querySelector('#pv-body').innerHTML = r.body || '';
  // Scroll to form
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  toast(`Loaded “${r.title}” into the form — edit and Save to update.`);
}
async function toggleAnnActive(r) {
  try {
    await apiCall('POST', 'announcement', { body: { ...r, active: !r.active } });
    toast(r.active ? 'Hidden from users' : 'Now visible to users');
    await renderTab();
  } catch (e) { toast(e.message, true); }
}
async function deleteAnnouncement(id) {
  if (!confirm(`Delete announcement "${id}"? This cannot be undone. (Use Hide instead if you might want it back.)`)) return;
  try {
    await apiCall('DELETE', 'announcement', { params: { id } });
    toast('Deleted');
    await renderTab();
  } catch (e) { toast(e.message, true); }
}

/* ---------- Auto-unlock if we already have a valid pw ---------- */
(async function autoUnlock() {
  if (getPassword()) {
    try {
      await apiCall('GET', 'stats');
      bootApp();
    } catch {
      clearPassword();
    }
  }
})();
</script>
