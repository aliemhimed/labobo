<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, Helvetica, sans-serif">
<rect width="640" height="320" fill="#ffffff"/>
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3c5e">Common Intramuscular (IM) Injection Sites</text>
<!-- deltoid (arm) -->
<rect x="50" y="90" width="120" height="150" rx="20" fill="#f1c9a8" stroke="#b07a55"/>
<circle cx="110" cy="130" r="13" fill="#c0392b" opacity="0.7"/>
<text x="110" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c5e">Deltoid</text>
<text x="110" y="282" text-anchor="middle" font-size="11" fill="#666">Vaccines (adults)</text>
<!-- vastus lateralis (thigh) -->
<rect x="260" y="80" width="120" height="170" rx="24" fill="#f1c9a8" stroke="#b07a55"/>
<circle cx="320" cy="170" r="14" fill="#c0392b" opacity="0.7"/>
<text x="320" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c5e">Vastus lateralis</text>
<text x="320" y="290" text-anchor="middle" font-size="11" fill="#666">Infants / children</text>
<!-- gluteus (hip) -->
<rect x="470" y="90" width="130" height="150" rx="30" fill="#f1c9a8" stroke="#b07a55"/>
<circle cx="555" cy="135" r="14" fill="#c0392b" opacity="0.7"/>
<text x="535" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c5e">Ventrogluteal</text>
<text x="535" y="282" text-anchor="middle" font-size="11" fill="#666">Deep / large-volume</text>
</svg>
